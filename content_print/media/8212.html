				<h2>針對今日《蘋果》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>
	針對蘋果即時今(28)日稍早題為「余天拍桌有內幕　傳黨中央要金主『一人給吳沛憶一百萬』」報導，民進黨發言人林琮盛表示，該則報導並非事實，為免混誤錯引，特此說明，勿再以訛傳訛。</div>
<div>
	&nbsp;</div>
<div>
	林琮盛強調，任何黨員要不要參選，或在哪裡參選，都是黨員的權利。另所謂協調，依照黨的程序來說，是黨內初選登記之後，才會展開黨的協調機制。</div>
<div>
	&nbsp;</div>
<div>
	林琮盛表示，報導前既已採訪過高幸雪副秘書長，其亦否認毫無此事，該報導卻仍以匿名者爆料方式刊出不實說法，民進黨深感遺憾！</div>
