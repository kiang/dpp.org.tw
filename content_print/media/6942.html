				<h2>民主進步黨2016選舉對策委員會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對本黨台北市第三選區（中山、松山區）立法委員提名人梁文傑退選案，民進黨選對會召集人蘇嘉全今(28)日表示，在上週中常會授權選對會處理本案後，今天選對會已做成正式決議，同意梁文傑退選。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 另外，對於目前該選區另有兩位在野參選人，蘇嘉全也表示，選對會將會尋求進一步協調整合的可能性，希望本選區能夠整合出一位候選人，以最好的參選條件迎戰國民黨，爭取最後的勝選，也讓進步力量在國會過半的目標，更往前一步。</div>
