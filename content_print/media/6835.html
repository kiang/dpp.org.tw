				<h2>民進黨針對日本國會通過安保相關法案之看法</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對日本國會日前通過安全保障相關法案，民主進步黨發言人阮昭雄今（20）日表示，我們了解到，安保相關法案的通過，關係到日本的防衛體制，強化美日安保架構，也提供日本對國際安全事務更多參與的基礎，負擔更多區域和平穩定的責任。民進黨正面看待美日安保在地區作為維繫安全與穩定的力量，我們期待日本對區域和平與安全作出積極貢獻，也將持續關注區域情勢的發展</p>
