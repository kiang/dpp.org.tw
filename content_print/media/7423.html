				<h2>高雄大地震災害應變會議三點指示</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對高雄大地震災害，總統當選人蔡英文主席、副總統當選人陳建仁今（6）日上午8時半至民進黨中央黨部召開緊急會議，邀集民進黨秘書長吳釗燮等主管，召開「災害應變會議」。隨後做出指示如下：</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 一、即刻取消蔡英文主席初一至初四發紅包及參拜行程。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 二、指派黨秘書長吳釗燮今盡速赴台南了解災情狀況並協調後續相關支援工作。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 三、委請南部執政縣市首長投入協助救災，並盡速提供一切資源及人力，包括後續災後重建復原及心理諮詢等工作。</div>
