				<h2>陳菊籲速讓陳前總統保外就醫</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div align="center"><b><span style="font-size: 18pt">陳菊籲速讓陳前總統保外就醫</span></b></div>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 28pt"><span style="font-size: 14pt">針對台大、榮總醫師昨為陳前總統看診後聲明，陳前總統未獲妥當醫療待遇，且病況嚴重、病歷混亂，卻沒有主治醫師，甚至連基本的藥物都未依專業處置一事，民進黨發言人林俊憲今（10）日轉述代理主席陳菊的關切說，已有多位專業醫師在看診後提出嚴正警告，法務部基於醫療人權與人道，應速讓陳前總統保外就醫。</span></div>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 28pt">&nbsp;</div>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 28pt"><span style="font-size: 14pt">林俊憲說，陳菊主席關心陳前總統的健康情況，她接任代理主席後，經常叮囑立院黨團三長抽空探視。獲悉昨日台大、榮總醫師看診的結果，陳菊深感憂心，上午再次指示立院黨團向北監及法務部表達嚴正的關切。 </span></div>
