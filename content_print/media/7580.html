				<h2>民主進步黨第十六屆第七十六次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 民主進步黨今(6)日召開第十六屆第七十六次中常會，會中邀請台中市長林佳龍、台中市政府社會局局長呂建德以「打造國際NGO中心」為題進行專案報告。發言人楊家俍會後轉述蔡英文主席聽取報告後裁示，全文如下：&nbsp;</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 「踏實外交」，是我們的目標，未來我們也要全力推動「踏實外交」的互惠互助交流。台中市政府今天提出的，利用舊台灣省議會，也就是現在的立法院中部辦公室，來發展成國際NGO中心的構想，非常有創意。請行政院成立專案小組，協助台中市政府規劃籌備相關工作。至於立法院的部份，則拜託蘇嘉全院長和柯建銘總召報告協調。</div>
