				<h2>民進黨：期盼中國大陸以平常心看待此次通話</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對蔡英文總統致電美國總統當選人川普一事，民主進步黨今（3）日表示，中華民國台灣長期和美國保持有好關係，蔡總統恭賀川普當選，並期許台美未來能進一步合作，係屬正常的祝福，期盼中國大陸以平常心看待此次通話。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 民主進步黨認為，台灣外交處境艱難，因此需和美國與中國大陸保持良好關係，台灣和兩者的關係同樣重要。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 民主進步黨呼籲中國大陸，東亞局勢穩定是兩岸共同責任，希望未來在新形勢下，共同致力於開展兩岸良性互動，創造有利區域和平繁榮與安定發展的格局。</div>
