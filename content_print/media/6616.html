				<h2>民進黨：拋磚引玉，祈願傷者早日度過難關</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 民主進步黨發言人鄭運鵬今(29）日表示，民進黨對新北市遊樂園嚴重公安意外表達最大的關心，祈願傷者能夠早日度過難關。有鑑於此次意外傷患的醫療及復健所需經費龐大，中央黨部也鼓勵所有民眾踴躍捐輸，將善款捐往新北市社會救濟會報專戶（帳號：027038002803 臺灣銀行板橋分行。匯款單上加註指定用途「八仙粉塵氣爆救助專案」）</p>
<p>&nbsp; &nbsp; &nbsp; 為此，蔡英文主席指示民進黨中央黨部捐款五十萬元，主管會報也決定全體中央黨部黨務主管捐出一日所得，藉此拋磚引玉。至盼全國民眾同心協力以度過這個難關。</p>
