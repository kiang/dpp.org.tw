				<h2>蘇主席：感謝美國依據台灣關係法提供台灣防衛性武器</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: justify;">&nbsp; &nbsp; &nbsp; 民主進步黨蘇貞昌主席今美國時間(8)日下午抵達美國洛杉磯，晚間出席餐會時接受媒體聯訪，針對媒體詢問恰逢歐習會結束，關於中國向美方提出不軍售給台灣的態度，蘇主席如何看？蘇主席表示，根據台灣關係法第二條第二項提供台灣防衛性武器，這是美國的政策，也明文規定。他特別感謝這三十幾年來美國一直遵守這項政策，讓台灣免於受他人威脅的恐懼。他強調，台海關係的和平最重要的是中國不要武力威脅台灣，讓台灣能夠和平。「台灣人是最善良且愛好和平的」，他表示，這趟美國行他會和美國的政府官員、國會的領袖見面，表達台灣人的善意。</p>
