				<h2>林俊憲：不分黨派一同維護國民健康</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">

	                <p>&nbsp;</p>
<div style="text-align: center; text-indent: 38.05pt; margin: 0cm 0.9pt 0pt 8.6pt" align="center"><b><span style="color: black; font-size: 18pt">林俊憲：不分黨派一同維護國民健康</span></b></div>
<div style="text-indent: 30pt; margin: 0cm 0.9pt 0pt 8.6pt"><span style="color: black; font-size: 14pt">對於媒體詢問本黨執政六縣市昨（12）日針對瘦肉精達成「三項要求、四點行動」決議，會否演變成「地方包圍中央」一事，民進黨發言人林俊憲今（13）日上午受訪時強調，不存在所謂地方包圍或地方對抗中央的問題，而是因為馬政府罔顧人民健康、漠視民意，地方首長必須採取行動，以確保廣大民眾的健康。林俊憲強調，國人健康與食品安全問題，不分黨派也不分藍綠，各縣市政府查緝違法食品添加物，是其職責所在，呼籲地方首長和各級民意代表一同加入維護國民健康的行列，基層選民也可以打電話向選區立委反映心聲。</span></div>
