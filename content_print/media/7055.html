				<h2>回應秋鬥團體遊行_新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 今天，秋鬥團體遊行並集結至蔡英文總統競選總部，發表有關教育、土地、性別、勞工等各項訴求。民進黨由曾擔任勞委會主委的李應元委員，駐守現場、了解各項訴求，並表示本黨必會傾聽建言，於研議重要政策時納入參考。 &nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp; &nbsp; &nbsp; 李應元員委員進一步表示，本黨目前已提出許多與秋鬥訴求相關的政策，並將持續發表相關主張，我們有決心與信心，未來能夠實踐這些政策，並禁得起社會各界的持續檢視。</p>
