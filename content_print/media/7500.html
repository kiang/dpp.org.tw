				<h2>女童遭殺害 蔡英文：痛心與不捨</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對今天上午發生四歲幼童遭歹徒殺害案件，民進黨發言人王閔生稍早轉述蔡英文主席談話表示，聽到小朋友無辜受難的消息，讓她感到非常痛心與不捨，她期待相關單位儘速偵辦，對犯罪者予以法律制裁，也要全力協助家人走出傷痛。</p>
<p>&nbsp; &nbsp; &nbsp; 王閔生說，蔡主席也認為政府有責任強化治安的維護，建構一個更完整的社會安全網，避免這樣的事件再度發生，讓人民可以安心生活：而對於隨機殺人的事件頻傳，政府應該參考各國對於此類形態犯罪的研究與預防對策，從教育、經濟安全、及心理健康等層面根本強化，徹底防杜這類型犯罪的滋生，才是解決問題的根本態度。</p>
