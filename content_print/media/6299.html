				<h2> 鄭運鵬：黨秘書長代表主席表達對陳前總統的關心</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 民主進步黨秘書長吳釗燮今（6）日下午1430前往陳前總統高雄住處探視，黨發言人鄭運鵬轉述表示，吳秘書長對於陳前總統獲得保外就醫感到欣慰，並且認為陳前總統的病況的確需要長期且專業的療養，保外就醫的確是最佳的人道安置。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 鄭運鵬說，會面過程中，吳秘書長也表示自己過去曾為執政時期的部屬，今天除了表達個人關懷之外，也代表蔡英文主席及中央黨部幹部表達對陳前總統的關心，希望陳前總統可以安心靜養與休息。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 鄭運鵬表示，陳前總統最後也感謝中央黨部的協助與關心，並祝民進黨黨務順利圓滿。</div>
