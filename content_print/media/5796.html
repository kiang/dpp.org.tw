			<div class="bar_green PL10" id="print_parts">
				<p class="news_content_date">2014-03-22</p>
				<h2>組織部發文要求黨員聲援群眾行動時不得攜帶旗幟或穿個人背心</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;</p>
<p class="MsoNormal" style="text-align:justify;text-justify:inter-ideograph;
text-indent:26.0pt;mso-char-indent-count:2.0"><span style="font-size: medium;"><span style="font-family: 標楷體;">民進黨發言人張惇涵今<span lang="EN-US">(22)</span>日上午表示，馬政府欲強行通過服務貿易協議，</span></span><span style="font-family:標楷體"><wbr></wbr><span style="font-size: medium;">又對公民運動蠻橫不回應，引發全國學生及群眾運動風起雲湧，</span><wbr></wbr><span style="font-size: medium;">不少民進黨黨公職也予以聲援和關心，不過，未免模糊焦點或遭曲解，</span><wbr></wbr><span style="font-size: medium;">民進黨中央黨部組織部已在昨晚及今晨，分別發出簡訊及正式公文，嚴正要求並約束各級黨部、黨公職及擬參選人、黨員同志，「</span><wbr></wbr></span><span style="font-size: medium;"><span style="font-family: 標楷體;">不得攜帶旗幟、穿著背心等與個人選舉相關之物品」至群眾現場，中央黨部要求各級黨部及本黨黨員同志嚴格遵守。</span></span></p>
