				<h2>民進黨：樂見並肯定大法官釋憲保障同性婚姻合法化</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對今(24)日大法官釋憲保障同婚，民主進步黨發言人阮昭雄表示，本黨樂見並肯定大法官釋憲保障同性婚姻合法化的這項結果。我們支持婚姻平權，也期待社會有更多的對話和包容，後續會和所有朋友站在一起，推動有關婚姻平權的各項法案，完成相關法律修正或制定，讓制度趨於完善。</p>	                	            </div>
