				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="text-align: justify;">
	民主進步黨發言人何孟樺今（７）日表示，民進黨對花蓮大地震的災民表達最大的關心，祈願傷者能夠早日度過難關。為此，民進黨中央黨部捐款一百萬元、民進黨中央黨部全體黨工捐款一日所得，藉此拋磚引玉，至盼全國民眾同心協力以度過難關。</div>
