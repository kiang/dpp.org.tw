				<h2>民主進步黨第七屆第55次中常會_新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>民進黨今日召開中常會，通過決議如下：<br />
<br />
一、劉世芳常委提案，要求黨中央舉辦產業政策研討會，常會通過將該提&nbsp;&nbsp;&nbsp;&nbsp; 議併入政策委員會<br />
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 年度計畫之「產業政策擴大會議」，於明年三月底前召開。<br />
二、常會決議下週三（十二月廿四日）召開中執會。</p>
