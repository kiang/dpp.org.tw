				<h2>針對今日媒體報導有關中嘉案之回應</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對今（20）日部分媒體報導「審中嘉案 投審會臨時叫停」相關説法，民進黨發言人王閔生表示，黨政軍退出媒體是法律所明訂，根據了解，投審會是認為所謂資金來源有問題，所以需要退回NCC重審，報導內容純屬臆測，不是事實。王閔生表示，該案進行重審合乎價值與人民利益，若有相關誤導訊息，切勿以訛傳訛。</p>
