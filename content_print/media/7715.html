				<h2>新春開工 洪耀福：祝國人新的一年大吉大利、大豐收</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 今(2)日新春開工日，民主進步黨秘書長洪耀福上午偕同黨發言人群發放中央黨部開工紅包，秘書長洪耀福致詞時表示，中央黨部其實從大年初一就陪總統到各地發紅包，這次總統所到之處，民眾反應都非常熱烈，每個地方都大排長龍，黨工都很辛苦。秘書長說，今天是開工第一天，祝全國同胞新年快樂，今年大吉大利、大豐收。</p>
