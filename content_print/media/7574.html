				<h2>民進黨：嚴厲譴責以仇恨言論製造社會對立</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對洪素珠女士藉採訪以仇恨言論辱罵老榮民，並散佈相關影像。民主進步黨發言人阮昭雄今（10）日表示，對於洪姓女士這種刻意破壞族群關係、以仇恨言論製造社會對立、不負責任的行為，民進黨給予最嚴厲的譴責。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 阮昭雄表示，台灣是民主國家，沒有一個人必須為自己的認同而受到歧視，對於洪姓女士這種仇恨言論攻擊其他人並散佈相關影像的惡劣行徑，這已超過言論自由的範疇，民進黨呼籲相關單位應主動偵查，務必讓這種不文明的事情不再發生。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 阮昭雄並呼籲國人各界共同拒絕這樣的仇恨語言，也不要傳播這樣的訊息。</div>
