				<h2>民進黨：童家暴案調查結果送週三中常會</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對台北市議員童仲彥家暴案，民進黨發言人黃適卓今(6)日重申，不論黨員是否為終身黨員，或是否自行退黨，本黨相關調查及懲處機制都會持續走完，「若黨員同志確實涉及違紀之情事，傷害黨的形象，一律嚴懲，決不寬貸。」黃適卓強調，由中央黨部組織部及台北市黨部組成的調查小組已完成調查，調查報告將送本週三中常會，調查小組建議做出最嚴厲之處份。</p>
