                <div id="media_contents" class="w80 container">

	                <p>&nbsp; &nbsp; &nbsp;&nbsp;<span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 22pt; text-indent: 22pt;">針對今</span><span lang="EN-US" style="font-family: 新細明體 serif; font-size: 10pt; line-height: 22pt; text-indent: 22pt;">(30)</span><span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 22pt; text-indent: 22pt;">日《中國時報》「為</span><span lang="EN-US" style="font-family: 新細明體 serif; font-size: 10pt; line-height: 22pt; text-indent: 22pt;">2016</span><span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 22pt; text-indent: 22pt;">開路 小英下月訪日」報導內容稱「小英號啟航！民進黨主席蔡英文的國際戰，首站將從日本開始，預計下月底安排前往日本東京、福岡」云云，民進黨發言人鄭運鵬表示，蔡主席目前並沒有這樣的規畫與安排，該報導所稱「預計下月底安排前往日本東京、福岡訪問」，也非事實，為免讀者及各界誤解，特此澄清說明，敬請媒體及各界明察。</span></p>
