				<h2>民進黨針對時報週刊不實報導之回應</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp;&nbsp;<span style="font-family: 新細明體;">針對《時報週刊》今（</span><span lang="EN-US">29</span><span style="font-family: 新細明體;">）日一則題為「柯文哲想設熱線</span> <span style="font-family: 新細明體;">蔡英文幕僚冷酸：用</span><span lang="EN-US">LINE</span><span style="font-family: 新細明體;">就好」報導，民進黨發言人楊家俍表示，蔡主席身邊的幕僚，沒有任何人曾經這樣說，週刊的報導不是事實，周刊在沒有查證下逕此報導，令人感到不解與遺憾。</span></p>
<p class="MsoNormal"><span lang="EN-US">&nbsp; &nbsp; &nbsp; &nbsp;</span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;
mso-hansi-font-family:&quot;Times New Roman&quot;">楊家俍說，民進黨與市府團隊一直有多元、順暢的溝通管道。事實上，今早雙方幕僚便就此一錯誤報導進行聯繫，並認為報導是無稽之談。</span></p>
