				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;針對學生前往行政院抗爭之行動，民主進步黨發表聲明如下：</p>
<div>&nbsp;</div>
<div>一、請目前在行政院的學生保持冷靜、理性，並請警方保持克制，不要有傷害學生的行為。</div>
<div>&nbsp;</div>
<div>二、請本黨黨公職持續駐守立法院，守護現場學生的安全。</div>
<div>&nbsp;</div>
<div>三、我們要再次呼籲馬總統應立即出面與學生對話，以平息爭議。</div>
