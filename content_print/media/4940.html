minor-fareast;mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast">民主進步黨今（<span lang="EN-US">9</span>）日召開第十四屆第六十次中常會，邀請前駐歐盟代表高英茂報告「法國大選及歐盟發展之展望」。黨發言人林右昌表示，對於本週六（<span lang="EN-US">12</span>日）即將進行第十四屆黨主席選舉最後一場電視政見會，黨秘書長蘇嘉全會中特別轉述代理主席陳菊的談話，期待所有候選人本於事實、勿做人身攻擊，並透過此一機會，向全體台灣人民共同展現民進黨的格局與視野。此外針對有人質疑<span lang="EN-US">2010</span>年五都縣市長選舉時有候選人涉及違紀參選一事，蘇嘉全也在今日常會中鄭重表示，<span lang="EN-US">2010</span>年五都大選的候選人，都是由黨正式提名徵召的候選人，並沒有任何違紀的問題。<span lang="EN-US"><o:p></o:p></span></span></p>
