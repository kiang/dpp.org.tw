				<h2>黃帝穎：立即讓陳前總統保外就醫，進行居家治療</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: center;">&nbsp;</p>
<div>針對陳前總統病情嚴重惡化，民進黨發言人黃帝穎今（18）日表示，蔡英文主席對此至為憂心，已指示盡快尋求各種可能給予最大的協助。蔡主席也鄭重呼籲馬政府應以陳前總統的醫療人權為考量，依照包括榮總等醫療團隊的專業建議，讓陳前總統盡快保外就醫，並進行居家療養。</div>
<div>&nbsp;</div>
<div>為此，黃帝穎再度強力要求馬總統應該尊重醫師的專業判斷，讓法務部秉持兩公約的人權標準，確實依法行政，立即讓陳前總統保外就醫，進行居家治療。</div>
