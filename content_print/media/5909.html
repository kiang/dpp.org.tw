				<h2>台北市長在野整合民調結果將送交中執會討論</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">

	                <p>&nbsp; &nbsp; &nbsp;<span lang="EN-US" style="line-height: 20pt; text-align: justify; text-indent: 24.8pt; font-size: 10pt; font-family: 新細明體 serif; letter-spacing: 0.7pt;">2014</span><span style="line-height: 20pt; text-align: justify; text-indent: 24.8pt; font-size: 10pt; font-family: 新細明體 serif; letter-spacing: 0.7pt;">台北市長在野整合協調小組召集人高志鵬今<span lang="EN-US">(13)</span>日表示，參與台北市長在野整合的姚文智委員、柯文哲醫師，兩人民調皆贏過國民黨的候選人連勝文，雖然柯醫師贏得比較多，但在野陣營仍將就施政方針、價值理念、輔選架構等進行協商，因此，小組將把民調結果送交<span lang="EN-US">6</span>月<span lang="EN-US">18</span>的民進黨中執會，由中執會做進一步的討論和決定。</span></p>
