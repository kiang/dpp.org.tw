				<h2>林俊憲：呼籲中國政府確保陳光誠安全，停止非法侵害人權</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;</p>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 34pt"><b><span style="font-size: 16pt">林俊憲：呼籲中國政府確保陳光誠安全，停止非法侵害人權</span></b></div>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 30pt"><span style="font-size: 14pt">針對中國維權人士陳光誠律師及其家人遭受違法監禁及暴力對待一事，民進黨發言人林俊憲今表示</span><span style="font-size: 14pt">，民主、自由、人權是普世價值，不容政府侵犯。林俊憲呼籲中國政府應確保陳光誠及其家人之人身安全及自由，並應正視人民對於民主自由及人權保障的殷切期盼，落實其已簽署之兩項國際人權公約，停止以非法、不當手段侵害人民之基本人權。</span></div>	                	            </div>
