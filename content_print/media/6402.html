				<h2> 民進黨區域立委初選領表登記截止 共77人登記參選</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 第九屆區域立法委員提名初選領表登記於今(6)日下午五時截止，民主進步黨發言人鄭運鵬表示，相關作業順利圓滿，經統計，43個選區共77人完成登記（各選區登記名單如附表）。鄭運鵬表示，3月8日前將由選對會進行各選區的協調工作，11日由中執會確認登記參選同志的資格審查，並自3月19日至4月10日陸續進行各選區初選民調，並於4月15日公告提名。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 第九屆立法委員選舉共73選區，除第十六屆第七次中執會決議之30個艱困徵召選區外，其餘43個選區皆提名1席，依選務日程辦理提名初選登記作業。</div>
