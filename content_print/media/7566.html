				<h2>民進黨：議員問政應該秉持理性問政原則</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對苗栗議員拿K他命質詢遭警方偵辦一事，民主進步黨發言人王閔生今(26)日表示，民進黨第一時間就請組織部對此事表達高度關切，對於議員問政，我們認為應該秉持理性問政原則，堅持法理精神，掌握問政的份際，並提醒各地方公職問政時應引以為戒，同時我們尊重警方依法處理之職責。</p>
