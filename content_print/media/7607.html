				<h2>民主進步黨針對李全教二審判決當選無效定讞之聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對國民黨籍台南市議長李全教二審判決當選無效定讞，民主進步黨發言人王閔生今(30)日表示，本黨樂見並肯定判決結果，這對賴清德市長而言是遲來的正義，也證明市長一直以來所堅持的價值。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 王閔生表示，李全教涉及臺南市議會議長、議員雙重賄選案，不僅重創台灣民主，更對台灣的地方政治及市民的光榮感，帶來很大的傷害，國民黨應引以為戒。我們也希望社會對李全教事件有所警覺，務必根除黑金介入地方政治的弊病，讓台灣民主機制更健全。</div>
