				<h2>民進黨：期許朝野政黨能夠攜手，通力合作推動各項改革</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對立委黃國昌昨(25)日順利連任時代力量黨主席、洪秀柱女士今（26）日甫當選國民黨主席，民主進步黨發言人王閔生今(26)日轉達總統當選人蔡英文主席恭賀之意。</p>
<p class="p2">&nbsp;</p>
<p class="p1"><span class="s1">&nbsp; &nbsp; &nbsp; 王閔生表示，面對台灣當前的諸多困境，朝野政黨與各界間的共識與合作，是全民的共同期待。為了讓台灣的政黨政治走向更成熟的方向，我們期許朝野政黨能夠攜手，通力合作推動各項改革，共同解決台灣面臨的各項問題與困境，必為社會所樂見。</span></p>
