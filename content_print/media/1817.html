				<h2>有關性產業相關議題聲明稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">日前『日日春關懷互助協會』、『推動縮減性產業聯盟』已拜會競選總部並遞交承諾書，由全國競選總部動員群婦女部何佳玲副主任負責接待。針對『日日春關懷互助協會』、『推動縮減性產業聯盟』提出性產業政策制訂及修法刪除社維法第</span><span style="FONT-SIZE: 9pt">80</span><span style="FONT-SIZE: 9pt">條『罰娼條款』之訴求，本總部提出以下之聲明：</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">民進黨作為負責任的政黨，將朝『有效處理性產業政策』的方向努力。</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">針對推動『刪除社會秩序維護法第</span><span style="FONT-SIZE: 9pt">80</span><span style="FONT-SIZE: 9pt">條』，總部立場傾向支持『不處罰賣性者』，但『是否罰嫖、及處罰性交易得利之第三者』的部分，各團體仍尚有爭議，須社會公共討論達成共識。</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">總部支持朝『修改』而非完全『刪除』該法條的目標努力。</span></div>	                	            </div>
