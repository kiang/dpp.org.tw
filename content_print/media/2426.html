				<h2>民主進步黨第七屆第49次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt">一、針對民進黨立委蕭裕珍於立法院中脫離民進黨立院黨團參加其他黨團，雖經黨團三長與其溝通，並行文要求黨中央處理，而常會亦於數月前決議由黨主席與黨團總召集人再與她協商，唯仍未獲正面回應。近日蕭立委更公然替非本黨提名人助選，攻擊民進黨，中常會今日不得不痛苦決議將蕭裕珍立委移送中評會議處。其他為非本黨提名人助選的黨員，俟組織部進行瞭解，蒐集相關資料後，視情節輕重再行處理。<span lang="EN-US"><o:p></o:p></span></span></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span lang="EN-US" style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt"><o:p>&nbsp;</o:p></span></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt">二、常會今日決議下次中執會召開時間為<span lang="EN-US">10</span>月<span lang="EN-US">15</span>日於嘉義召開，以確定本黨嘉義市立法委員補選的提名人選為蔡同榮中常委。 <br /><br /><br /><br /><br /><br /><br /><span lang="EN-US"><o:p></o:p></span></span></p>	                	            </div>
