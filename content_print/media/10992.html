				<h2>民進黨原民部爭取新北市深澳族人認同與支持</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>民進黨原民部26日在新北市瑞芳深澳區辦原住民族座談會，民進黨原民部代理主任俄鄧 殷艾細數民進黨推動原住民族權益向族人報告與澄清禁伐補償爭議，為民進黨爭取更多認同與支持。</p>

<p>俄鄧代理主任表示今日已辦理第十場都會區原住民族座談會，與在地幹部共同努力辦座談會向族人報告民進黨實質推動的原住民族權益與福利，為民進黨賴主席爭取更多認同。</p>

<p>陳瑩立委服務團隊向多名瑞芳區頭目、族人致意，並說明勞工安全等權益，讓從事勞工的族人有所保障。</p>

<p>俄鄧代理主任強調幾十年來，民進黨與族人共同努力為原住民族權益來奮鬥，也期待在地族人持續與民進黨站在一起。</p>
