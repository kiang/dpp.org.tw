<div align="center"><span style="font-size: medium"><b>林右昌：「一國兩區」踩台灣社會紅線，民進黨一定有所作為</b></span></div>
<div style="text-indent: 28pt"><span style="font-size: medium">針對媒體詢問民進黨是否針對「一國兩區」爭議號召民眾上街遊行？民進黨發言人林右昌今（26）日上午受訪表示，馬總統提出「一國兩區」的主張，已經嚴重傷害並矮化台灣的國家主權，不但違背主流民意，更踩到了台灣社會的紅線。民進黨認為，馬英九這樣的主張是冒進的，也是極為不智的！民進黨站在守護國家主權，台灣前途必須由2300萬人自主決定的立場上，一定會有所作為。</span></div>	                	            </div>
