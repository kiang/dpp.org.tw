				<h2>民主進步黨第七屆第24次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; LETTER-SPACING: 0.75pt"><font face="新細明體">為了全力輔選民進黨桃園縣長候選人呂秀蓮，常會針對選務、民調、選戰策略、造勢活動、組織動員、監票及防止賄選工作進行廣泛的討論與建議。常會決議：<span lang="EN-US"><o:p></o:p></span></font></span></p>
<p style="TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; LETTER-SPACING: 0.75pt"><font face="新細明體">一、下星期三常會仍至桃園召開。<span lang="EN-US"><o:p></o:p></span></font></span></p>
<p style="TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; LETTER-SPACING: 0.75pt"><font face="新細明體">二、中央黨部自明日起進駐呂秀蓮中壢競選總部，成立工作小組。成員包括文宣部主任陳文茜、婦女部主任李永萍、青年部主任翁章梁、中國事務部主任顏萬進、主席室副主任劉坤鯉、組織部副主任洪耀福、國際事務部副主任蕭美琴，中央黨部工作小組將負責參與呂秀蓮競選文宣，聯絡黨內公職人員輔選，負責造勢活動等工作。 <br /><br /><br /><br /><span lang="EN-US"><o:p></o:p></span></font></span></p>
