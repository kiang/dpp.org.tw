				<h2>蔡英文針對高雄大地震災害之三點指示</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp;&nbsp;<span style="font-family: 新細明體;">針對高雄大地震災害，民進黨中央黨部今</span><span lang="EN-US">(6)</span><span style="font-family: 新細明體;">日凌晨啓動線上災情回報，蔡英文主席除致電台南市府秘書長，並透過聯合治理平台掌握</span><font face="新細明體">彙整災情狀況，蔡英文主席也代表黨部對受災的民眾表達誠摯慰問，及對前往救災的軍警消人員表達敬意，蔡英文隨即做出三點指示：</font></p>
<p><font face="新細明體"><br />
</font></p>
<p><font face="新細明體">1、請南部執政縣市首長投入協助救災，並盡速提供一切資源及人力。</font></p>
<p><font face="新細明體">2、南部縣市地方黨部即刻投入協助救災工作。</font></p>
<p><font face="新細明體">3、另指示在緊急救災告一段落後，全黨協助募集救援物資。</font></p>
<p>&nbsp;</p>
