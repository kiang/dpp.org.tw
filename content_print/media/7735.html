				<h2>針對《上報》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對《上報》昨（19）日報導「民進黨棄守農會改選　張榮味家族續獨霸」，民進黨發言人張志豪今（20）日表示，該則報導內容純屬臆測，不是事實，對於這樣的「報導」，民進黨感到遺憾。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 張志豪表示，對於農會選舉，全黨這段時間都動起來，各縣市輔選幹部也都團結一致、全力以赴，為共同目標持續努力。根據了解，針對這次農會選舉，我們都有推出人選登記，但目前結果尚未確定，因此報導所稱「民進黨長期執政的台南、高雄和屏東縣市，輔選幹部回報可掌握的農會代表人數全數掛零」云云，根本不是事實。媒體在未經查證下逕自寫作，令人遺憾。</div>
