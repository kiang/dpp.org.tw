<p style="text-indent:22.0pt;mso-char-indent-count:2.0;

font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:major-fareast;mso-fareast-theme-font:
major-fareast;mso-hansi-theme-font:major-fareast;mso-bidi-font-family:標楷體">民進黨秘書長暨副總統參選人蘇嘉全在宣布農地及建物贈與屏東縣長治鄉公所作為農業公益使用後，今（<span lang="EN-US">27</span>）由律師團代表黃帝穎律師攜帶所需文件，赴長治鄉公所辦理贈與相關手續。</span></p>
<p style="text-indent:22.0pt;mso-char-indent-count:2.0;
line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span lang="EN-US" style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:major-fareast;
mso-fareast-theme-font:major-fareast;mso-hansi-theme-font:major-fareast">&nbsp;</span></p>
<p style="text-indent:22.0pt;mso-char-indent-count:2.0;
line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span style="font-size:10.0pt;
font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:major-fareast;mso-fareast-theme-font:
major-fareast;mso-hansi-theme-font:major-fareast;mso-bidi-font-family:標楷體">黃帝穎律師表示，依據農發條例規定，農地可以贈與公法人，日前已正式發出公文給長治鄉公所，表明願將農地及建物贈與鄉公所之意思表示，長治鄉公所也依法回覆公文，並指明應檢附之文件。今日攜帶所需文件到鄉公所辦理相關手續，後續程序也會依據政府規定辦理，希望盡速完成農地贈與程序。</span></p>
<p style="text-indent:22.0pt;mso-char-indent-count:2.0;
line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span lang="EN-US" style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:major-fareast;
mso-fareast-theme-font:major-fareast;mso-hansi-theme-font:major-fareast">&nbsp;</span></p>	                	            </div>
