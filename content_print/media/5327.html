	                <div align="center"><b><span style="color: black; font-size: 16pt">對中國時報不實報導之回應</span></b></div>
<div style="text-indent: 30pt"><span style="color: black; font-size: 14pt">針對中國時報在今(10)日刊登〈蘇曾派人與陸接觸〉報導訛稱「蘇訪日期間倡議民主同盟，讓北京感受到強烈的『非善意』，&hellip;因此日前蘇在友人奔走下，派親信與中台辦幕僚單位人員在泰國曼谷會面」、「無奈最後還是無功而返」云云，民進黨發言人林俊憲上午嚴正駁斥：「絕無此事！」林俊憲說，這篇報導極盡捕風捉影與虛構之能事，本黨對於這種杜撰式的報導深感遺憾並予以譴責，期盼旺中記者能做到基本的新聞倫理與專業，莫一再為特定目的恣意杜撰報導。</span></div>	                	            </div>
