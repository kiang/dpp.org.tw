				<h2>黃帝穎：尊重柯文哲醫師的人事決定</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: left;">&nbsp; &nbsp; &nbsp; 針對無黨籍台北市長候選人柯文哲將陸續公布遴選委員會名單，民進黨發言人黃帝穎今（14）日受訪時表示，依據民主進步黨2014年6月18日召開之第十五屆第十三次中執會決議及2014台北市長在野整合協調小組共識，重申民進黨對柯文哲醫師立場：一在柯醫師當選市長後，不會要求柯醫師加入民主進步黨；二在柯醫師當選市長後，不會介入其人事安排。</p>
<p>&nbsp; &nbsp; &nbsp; 黃帝穎說，依據民進黨今年6月所做的決議，對柯醫師陸續公布遴選委員會名單，民進黨予以尊重及祝福。</p>
