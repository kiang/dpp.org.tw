minor-fareast;mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast">針對總統府發言人范姜泰基回應壹週刊報導「馬英九踩黑金地雷」一文指稱「馬總統於今（<span lang="EN-US">2011</span>）年九月十日的行程中確有嘉義行程，是一個有超過百人參加的公開黨務活動，並未安排文中所描述的不公開行程、更未前往黃市長家中。」民進黨發言人陳其邁表示，范姜泰基公然說謊，經查馬總統<span lang="EN-US">9</span>月<span lang="EN-US">10</span>日嘉義行程，非僅總統府所宣稱的一個，尚有多個未曝光行程，此事件涉及國家元首誠信問題，我們給他一晚的時間，請總統府想清楚再回答，不要陷入誠信危機。</span></p>
&nbsp;</span></p>
