				<h2>張俊雄：卸任禮遇完全合法今年二月主動放棄</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">針對張俊雄秘書長於行政院長卸任後使用座車一事，今日</span><span style="FONT-SIZE: 9pt">(23</span><span style="FONT-SIZE: 9pt">日</span><span style="FONT-SIZE: 9pt">)</span><span style="FONT-SIZE: 9pt">張俊雄秘書長鄭重提出澄清，「卸任閣揆禮遇」是各國慣例，台灣也不例外。張秘書長卸任後，完全是依「卸任閣揆禮遇辦法」接受禮遇，並無不法。</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">張俊雄前院長已於二月二日將行政院長座車，借調的行政院駕駛黃依靠正式歸建。此舉完全屬於自願，且主動放棄國家對卸任閣揆之禮遇。張俊雄前院長重申，放棄放棄國家對卸任閣揆之禮遇，出自於自願及個人選擇，並無意要求所有卸任閣揆比照辦理。</span></div>
