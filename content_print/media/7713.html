				<h2>民進黨：全黨從政同志嚴格要求自我，自我警惕</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對台北市議員童仲彥今（26）日自行退黨，民進黨發言人楊家俍表示，不論黨員是否為終身黨員，或是否自行退黨，本黨相關調查及懲處機制都會持續走完。楊家俍也轉述秘書長洪耀福指示強調，民進黨身為執政黨，人民會用更高的標準來看待我們，因此不管是私人領域，個人操守或公共事務，我們必須更加嚴格要求自我，全黨從政同志要以童仲彥的例子，自我警惕。</p>
