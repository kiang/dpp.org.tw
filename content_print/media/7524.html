                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="p1"><span class="s1">&nbsp; &nbsp; &nbsp; 針對近日日本熊本縣接連發生兩起強烈地震造成嚴重災情，民進黨發言人王閔生今（16）日表示，蔡英文主席除在日前指示吳釗燮秘書長聯繫日本交流協會，了解震災情況並致上我方關切與慰問外，今天也決定由民進黨中央捐出新台幣一百萬元，作為熊本大地震賑災所用，希望能藉此號召更多國人發揮同理心，協助災民度過難關，也讓受災地區能早日復原。</span></p>
