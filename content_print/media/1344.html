	                <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">民主進步黨今日</span><span style="FONT-SIZE: 9pt">(11/30)</span><span style="FONT-SIZE: 9pt">召開第十一屆第十六次中常會，今天常會中</span><span style="FONT-SIZE: 9pt">李應元</span><span style="FONT-SIZE: 9pt">副秘書長針對</span><span style="FONT-SIZE: 9pt">1204</span><span style="FONT-SIZE: 9pt">「顧台灣、拼中國、保平安、拼幸福」大遊行進行專案報告，主席裁示內容如下：</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt">&nbsp;</div>
<div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">12</span><span style="FONT-SIZE: 9pt">月</span><span style="FONT-SIZE: 9pt">4</span><span style="FONT-SIZE: 9pt">日的「顧台灣、拼中國、保平安、拼幸福」大遊行，全黨的黨、公職同志，都要全部總動員站出來。展現像</span><span style="FONT-SIZE: 9pt">228</span><span style="FONT-SIZE: 9pt">手護台灣一樣的精神，凝聚所有支持台灣、拒絕中國，保台灣的平安拼人民幸福的力量。讓我們共同努力，為立委選戰最後衝刺，達成民主進步黨一百零一席、泛綠過半數、改革大進步的目標。</span></div>
