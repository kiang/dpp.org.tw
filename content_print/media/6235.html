				<h2>黃帝穎：期許民進黨提名議員候選人全壘打，力拚全數當選</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; &nbsp;針對民進黨台北市議員候選人聯合競選情形，民進黨發言人黃帝穎今（27）日表示，民進黨在台北市中山大同、中正萬華及大安文山三個選區，已完成聯合競選作業，希望支持者依據聯合競選的策略規劃，投給這三個選區的黨提名候選人，力拼全數當選。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; &nbsp;黃帝穎強調，民進黨及蔡英文主席對於黨提名候選人，均全力輔選，並未代替也不允許個別候選人借用其名義發送拜票簡訊或文宣，期許全國民進黨提名的議員候選人都能全數當選，未來到議會相互合作，強化地方自治立法，為人民爭取權益。</div>
