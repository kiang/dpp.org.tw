				<h2>副總統候選人蘇嘉全聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>民進黨副總統候選人蘇嘉全今（6）日透過競選辦公室發表聲明如下：</div>
<div>&nbsp;</div>
<div>針對本人位於屏東農舍的爭議，雖然屏東縣政府已認定為合法，但農委會主委及官員公開對此表示質疑，本人已經請我太太（農舍所有權人）今日向農委會和屏東縣政府提出申請共同辦理會勘，並希望在最短時間內做出結論。如有需要改善，或有任何的處罰，甚至必須完全拆除，本人都願意配合辦理。本人也希望同時農委會能將何謂「農民」、「農地農用」的定義釐清，讓全國各縣市政府和所有農地擁有者，都有共同的標準可循。&nbsp;</div>	                	            </div>
	            <div class="fb-quote"></div>
