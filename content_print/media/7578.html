				<h2>民主進步黨第十六屆第七十五次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 民主進步黨今(29)日召開第十六屆第七十五次中常會，會中邀請國發會主委陳添枝、外交部次長吳志中以「英國脫歐國際情勢與對台灣的影響」為題進行專案報告。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 黨發言人黃適卓會後轉述代理主席柯建銘委員裁示如下：</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 英國決定脫離歐盟，牽動的不只是歐洲各國關係，更要注意國際金融衝擊與資金流動。因此，建議政府相關部會密切注意國內股匯市近期是否出現異常波動，並做好各項準備，穩定國內經濟；而危機也可能是契機，後續也必須觀察國際資金對台灣可能產生的投資興趣，主動研擬方案吸引投資機會。</div>
