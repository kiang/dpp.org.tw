				<h2>民進黨中評會聲明稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對下週將登場的縣市議會正副議長選舉，民主進步黨中評會主委劉世芳今日下達「票票入匭，一票都不准跑」的要求，否則將祭出嚴厲的黨紀處分，期能一舉拿下多個縣市議會議事主導權。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 劉世芳並代表中評會嚴正提出三點宣示：</div>
<div>&nbsp;</div>
<div>一、<span class="Apple-tab-span" style="white-space:pre">	</span>將指派中評會委員即刻進駐重點縣市並全程監看。</div>
<div>二、<span class="Apple-tab-span" style="white-space:pre">	</span>要求各縣市黨部主委及評召當日現場全程監督。</div>
<div>三、<span class="Apple-tab-span" style="white-space:pre">	</span>中評會將於選後一周內立即召開會議處理相關黨紀案，開會通知今日發出。</div>
