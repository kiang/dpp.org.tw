				<h2>鄭運鵬：蔡主席在初選期間保持中立、不介入選舉</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對黨主席在初選期間的態度與立場，民主進步黨發言人鄭運鵬今(17)日表示，依據2016總統暨立委選舉對策委員會第1次會議決議，中央黨部昨日正式發函給登記參與立委選舉提名初選候選人，於初選期間應自我克制並遵守相關規範。鄭運鵬表示，蔡英文主席對積極投入初選同志們給予衷心祝福，期待同志們公平爭取提名。主席在初選期間，不為特定候選人站台、錄音或推薦，並保持中立、不介入選舉。待正式提名後，蔡主席將全力為黨提名候選人輔選，以贏得立委選舉，力拼國會過半。</p>
