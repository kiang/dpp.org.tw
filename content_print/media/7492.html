				<h2>針對布魯塞爾攻擊事件 蔡總統當選人深感哀悼</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 總統當選人蔡英文對於今(22)日布魯塞爾遭到恐怖攻擊造成數十人傷亡，表達至深哀悼。蔡主席在這個悲痛的時刻，代表台灣人民向比利時政府表達慰問之意，並譴責傷害無辜人民生命的恐怖攻擊行為。蔡主席也請民進黨秘書長吳釗燮分别致電比利時駐台代表處范睿可處長（Rik Van Droogenbroeck）及歐洲經貿辦事處馬澤璉處長（Madeleine Majorenko），向比利時政府與比利時人民，以及歐盟總部表達最深切的慰問之意。</p>
