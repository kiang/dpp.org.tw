				<h2>關於近日有關竹崎鄉長案件錯誤報導之聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對近日有媒體報導涉嫌教唆殺警案的嘉義縣竹崎鄉長王焜弘為民進黨籍一事，民主進步黨發言人阮昭雄今(14)日表示，王焜弘並非民進黨員，也未曾代表民進黨參選任何公職，事實上，王某歷次公職參選以及其代表黨籍的相關資訊在中選會網站即可輕易的查知（ 中選會網址如後，請輸入「王焜弘」， http://db.cec.gov.tw/histCand.jsp ）。阮昭雄說，為免錯誤報導混淆輿論，希望錯植這項資訊的媒體能夠立即更正。</p>
