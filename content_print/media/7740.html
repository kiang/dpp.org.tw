				<h2>民進黨: 一審獲判無罪無法掩蓋馬英九干預司法、毀憲亂政的事實</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對柯建銘自訴馬英九涉嫌洩密、誹謗，今(28)日一審獲判無罪，民進黨發言人王閔生表示，就算一審獲判無罪也無法掩蓋馬英九干預司法、毀憲亂政的事實!王閔生說，馬前總統為了發動政爭，涉入特偵組違法監聽、檢察總長拿個案向總統報告、總統及總長偵結前洩漏個資給第三人等違法毀憲的行為，讓國家的民主陷入危機，是最壞的示範。對此本黨還是期待司法勿枉勿縱、公正辦案。</div>
