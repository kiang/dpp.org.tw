				<h2>對副秘書長林右昌協助基隆市黨部處理入黨申請事項之說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: justify;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 有關基隆市黨部反映部分新進黨員身分有疑慮一事，民進黨發言人林俊憲今（25）日表示，蘇主席日前已公開宣示，自己當年競選連任屏東縣長時即受黑道所害，只要他在任黨主席一天，絕不容黑道染指民進黨。</p>
<p style="text-align: justify;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 林俊憲說，中央黨部今日上午指派黨副秘書長林右昌赴基隆市黨部協助處理，經了解，確有部分入黨申請書之介紹人未親自簽章，違反《民主進步黨入黨填表須知與審查作業要點》第三條「介紹人欄應由介紹人親自簽章，並註明黨證號碼」之規定，已協調基隆市黨部將該些申請書退回給介紹人。<br />
<br />
<br />
<br />
&nbsp;</p>	                	            </div>
