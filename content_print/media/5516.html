				<h2>美國眾議員向民進黨蘇主席重申美國對台軍售政策不變</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p><span style="font-size: 12px;">民進黨主席蘇貞昌今(22)日接見美國加州眾議員趙美心(Judy Chu)與關島眾議員博達悠(Madeleine Bordallo)。蘇主席特別針對媒體報導中國有意以調整軍事部署換取美國停止對台軍售一事，了解美方立場，兩位眾議員均重申美國對台軍售政策不變。</span></p>
