				<h2>民進黨針對黨籍公職疑涉遠雄海山煤礦造鎮弊案之聲明稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 有關民進黨立法委員吳琪銘疑似涉及遠雄海山煤礦造鎮弊案一事，民進黨聲明如下：</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 民進黨籍立委吳琪銘似涉及遠雄海山煤礦造鎮弊案一事，目前已由台北地檢署進行偵查，民進黨廉政會主委張天欽表示，全案須攤在陽光下接受檢驗，並且勿枉勿縱，期盼檢調查明。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 民進黨廉政會主委張天欽表示，廉政精神為民進黨對於本黨籍公職人員一貫之要求，面對此一事件，無論涉及人員之層級高低，本黨將依廉政條例之規定，主動啟動進行調查，並將於近期召開廉政委員會討論後續處理方式。</div>
