				<h2>多位退將赴中 民進黨：等同為中方的政治主張背書</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對吳斯懷等多位台灣退役將領今(11)日出席中共「紀念孫中山誕辰150周年」引發爭議一事，民主進步黨發言人阮昭雄表示，國人無須前往中國大陸，即可紀念孫中山先生的貢獻。而退役將領身份敏感，又不避嫌的屢次出席中共舉辦的統戰活動，等同為中方的政治主張背書。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 阮昭雄表示，連國民黨中央也不認為中共中央是孫文先生的後繼者，吳斯懷等退將享有豐厚的退休撫卹，此等混淆國家認同之行徑，不但影響國軍士氣，令人費解，也難被台灣社會接受。</div>
