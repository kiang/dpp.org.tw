				<h2>針對行政院長江宜樺表示將強化警力，強制驅離在行政院學生一事，民進黨聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp;民主進步黨主席蘇貞昌晚間邀集前主席蔡英文、謝長廷、游錫堃會商，針對行政院長江宜樺表示將強化警力，強制驅離在行政院學生一事，發表聲明表示：</div>
<div>強制驅離不是唯一手段，除必將造成眾多學生、警察的受傷之外，後續亦恐將引發學生更大的憤怒與抗爭，請馬總統立即出面，回應學生訴求，才是平息爭議，結束學生抗爭的最佳方式。</div>
<div>蘇主席並請黨團三長即刻聯繫江院長，表達本黨前述之立場。</div>	                	            </div>
