				<h2>民主進步黨針對檢警查獲陳明澤同志賭場案之聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對檢警查獲本黨高雄市議員陳明澤在賭場一事，民主進步黨發言人黃適卓今(31)日表示，本黨秉持毋枉毋縱的精神，支持檢警全力偵辦。若黨員確實涉及違紀之情事，傷害黨的形象，一律嚴懲，決不寬貸。黃適卓表示，黨秘書長洪耀福已責成組織部及高雄市黨部針對此案組成調查小組進行了解，檢具相關事證後，送下週中常會討論。</p>
