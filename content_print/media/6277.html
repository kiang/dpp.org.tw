				<h2>民主進步黨選舉對策委員會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="font-size: 11.8181819915771px;"><span style="font-size: 12px;">&nbsp; &nbsp; &nbsp;有關苗栗縣第2選區立委缺額補選事宜，昨日中執會決議授權交由下周中常會處理。民主進步黨選舉對策委員會召集人蘇嘉全今(25)日傍晚邀集該選區黨公職，包括立委吳宜臻、苗栗縣黨部主委李貴富、前縣議員詹運喜、台灣民主學院主任楊長鎮及青年部主任傅偉哲，討論並聽取相關意見。會中達成兩項共識。</span></p>
<div style="font-size: 11.8181819915771px;">&nbsp; &nbsp; &nbsp; 一、公民團體若有適當人選，民進黨可與其合作，當選後雙方建立適當互動機制。</div>
<div style="font-size: 11.8181819915771px;">&nbsp;</div>
<div style="font-size: 11.8181819915771px;">&nbsp; &nbsp; &nbsp; 二、公民團體若無適當人選，與會者一致接受，由中央黨部徵召人選並全力支持。&nbsp;</div>
<div style="font-size: 11.8181819915771px;">&nbsp;</div>
