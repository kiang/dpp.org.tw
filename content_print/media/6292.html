				<h2>馬總統元旦文告提國是會議 鄭運鵬：我們歡迎馬總統也來參加</h2>
				<h4></h4>

	                <p>&nbsp; &nbsp; &nbsp;<span style="line-height: 22pt; text-indent: 20pt; font-size: 10pt; font-family: 新細明體 serif; color: rgb(34 34 34); background-image: initial; background-attachment: initial; background-size: initial; background-origin: initial; background-clip: initial; background-position: initial; background-repeat: initial;">針對馬總統元旦文告，提出有關國是會議的說法，</span><wbr style="color: rgb(34 34 34); font-family: arial sans-serif; font-size: 14px;"></wbr><span style="line-height: 22pt; text-indent: 20pt;">民進黨發言人鄭運鵬今（</span><span lang="EN-US" style="line-height: 22pt; text-indent: 20pt;">1</span><span style="line-height: 22pt; text-indent: 20pt;">）日表示，民進黨欣見新的一年，</span><wbr style="color: rgb(34 34 34); font-family: arial sans-serif; font-size: 14px;"></wbr><span style="line-height: 22pt; text-indent: 20pt;">能有凝聚國人力量，共同面對台灣重大議題的契機。</span></p>
