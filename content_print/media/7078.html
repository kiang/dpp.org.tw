				<h2> 民主進步黨對自由報系創辦人林榮三先生辭世表示哀悼</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 對於自由報系創辦人林榮三先生辭世，民主進步黨今（28）日表示最誠摯的哀悼。發言人王閔生表示，蔡主席也將安排前往弔唁。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 王閔生表示，林榮三先生創辦自由時報，成為台灣本土文化及民主價值的重要言論平台，不但促進新聞自由，對台灣民主的深化、及社會多元意見的表達，更是貢獻良多。他的成就與貢獻，會被台灣人所懷念。</div>
