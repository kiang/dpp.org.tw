				<h2>對媒體報導本黨中評委遭指控下藥性侵案之回應</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: justify;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 對於今(27)日蘋果日報報導「綠中評委被控下藥挾女性侵」一事，民進黨發言人林俊憲表示，民進黨絕不容許黨員幹部的個人行為影響黨的名譽，黨秘書長林錫耀上午已指示中央黨部組織部立案調查，也希望司法機關儘速查明真相，如果查出確有此事，本黨絕對依黨紀給予嚴懲，絕不寬貸，若無媒體指控情事亦還當事人清白。</p>
