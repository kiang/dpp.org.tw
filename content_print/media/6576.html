				<h2>民進黨：呼籲洪秀柱針對黑箱課綱表態</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對昨晚台中一中校門口的學生反黑箱課綱活動，民主進步黨發言人鄭運鵬表示，目前已經有227所學校學生參與反黑箱課綱的活動，民進黨一再呼籲執政當局，應立即退回這個程序違法、背離現實的歷史課綱，並正面回應社會主流價值，以公開透明方式徵詢學界及基層教師等各專業團體意見，重新研定課綱。同時，鄭運鵬也呼籲國民黨的準總統參選人洪秀柱，應針對黑箱課綱表達自己的態度與立場。</p>
