				<h2>林俊憲：擬專案進行黨籍總檢查並增訂黨員入黨排黑條款</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;</p>
<div style="text-justify: inter-ideograph; text-align: justify; text-indent: 38pt"><span style="font-size: small">針對新進黨員入黨改革一事，民主進步黨發言人林俊憲 (29)日傍晚轉述黨秘書長林錫耀的話說，黨主席蘇貞昌日昨除了指示推動將入黨的形式審查改為實質審查，設置覆審委員會等把關機制，本週三提交中常會的改革方案還包括進行黨籍總檢查、增設黨員入黨排黑條款等內容。林俊憲說，在今日下午主管會議中，林錫耀也針對是否將現行入黨滿一年始擁有選舉權、被選舉權延長為兩年，以及恢復本黨早期黨員需參與活動訓練始具黨員權利的「黨員見習制」等可能方案，要求組織發展部研擬評估報告，併送本週三中常會做進一步的討論。</span></div>	                	            </div>
