				<h2>泛藍政策支票簡表----最新版</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">過去，連戰一方面說要推動「財政紀律法」，要候選人在開政策支票前，一定要先提出財源；但現在，連戰卻又大玩兩手策略，說一套，做一套！</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">目前中央政府每年總預算大約是</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">兆</span><span style="FONT-SIZE: 9pt">4,000</span><span style="FONT-SIZE: 9pt">億，但連戰至今所開出的選舉支票，就要國庫每年再多支出</span><span style="FONT-SIZE: 9pt">9,856</span><span style="FONT-SIZE: 9pt">億元，佔政府總預算的</span><span style="FONT-SIZE: 9pt">70%</span><span style="FONT-SIZE: 9pt">，而這些經費尚不包括四年兩兆的金額在內。平均每位台灣人民【包括剛出生的嬰兒】就要負擔</span><span style="FONT-SIZE: 9pt">4</span><span style="FONT-SIZE: 9pt">萬</span><span style="FONT-SIZE: 9pt">3</span><span style="FONT-SIZE: 9pt">千元。枉顧現實的漫天喊價，連戰亂開政策芭樂票，全民拒絕為他們買單！</span></div>	                	            </div>
