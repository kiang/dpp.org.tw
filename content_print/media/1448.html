				<h2>李應元副秘書長對於某週刊報導的說明 </h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; LAYOUT-GRID-MODE: char; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">針對某週刊報導卓師父一事，民進黨文宣部主任鄭文燦轉述李應元副秘書長的說明表示，李應元副秘書長近五年來只見過卓師父一次，是在今年總統大選前，由負責宗教事務的同仁安排拜訪，這項行程與其他拜訪行程並無不同。該週刊把一般的拜訪行程扭曲為選舉求神問卜，李應元副秘書長表示，我們尊重不同的宗教信仰，但是這樣的報導角度扭曲事實，把人民一票一票的選票投出來的總統大選，扭曲要依靠為求神問卜或者尋求神力，李副秘書長將去函更正，以正視聽。</span></div>
