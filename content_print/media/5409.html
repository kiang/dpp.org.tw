				<h2>蘇貞昌：肯定馬總統回應民意，民進黨全力支持覆議案</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="text-align: justify;">&nbsp; &nbsp; &nbsp; 針對馬總統宣布行政院將對《會計法》修正案提出覆議一事，民主進步黨主席蘇貞昌今(7)日上午表示，民進黨對於馬總統願意回應社會期待，循憲政途徑提出覆議，解決問題、化解爭議，表示肯定，本黨一定會全力支持這項覆議案。</div>
<div style="text-align: justify;">&nbsp;</div>
<div style="text-align: justify;">&nbsp; &nbsp; &nbsp; 蘇主席說，這次會計法的修法結果令民眾不能接受，引起社會極大爭議，民進黨會深刻檢討，引以為鑑，未來一定會更戒慎警惕，嚴格要求自己，符合人民期待。他表示，民進黨對《會計法》修法的立場很清楚，「立法疏漏必須補救、公款私用不能除罪」，希望循這個程序進行。</div>
<div style="text-align: justify;">&nbsp;</div>
