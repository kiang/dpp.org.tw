<p style="line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:minor-fareast;
mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 針對高院今<span lang="EN-US">(27)</span>日二審判決蔡煌瑯、廖本煙、趙永清等人依貪污罪被判刑一事，民主進步黨廉政委員會主委張天欽表示，本案經相關調查後，已於<span lang="EN-US">2009</span>年<span lang="EN-US">2</span>月<span lang="EN-US">12</span>日第三屆第六次廉政會議討論，會中決議依廉政條例第八條之一規定，「因渠等涉嫌違反廉政行為之時間已超過追訴期限，故不予受理。」</span><span lang="EN-US" style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:
minor-fareast;mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast"><br />
</span></p>
<p style="line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:minor-fareast;
mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast">　　廉政會主委張天欽表示，廉政條例第八條之一各款規範追訴權，自涉嫌違反廉政行為發生之日起算，屬刑事罰性質者，五年內未行使便消滅。因為該案發生於<span lang="EN-US">2002</span>年，而廉政會是<span lang="EN-US">2008</span>年<span lang="EN-US">2</span>月<span lang="EN-US">26</span>日接受檢舉而受理此案，故在本會當時受理此案時已超過五年的追訴期限。</span></p>
<p style="line-height:20.0pt;mso-line-height-rule:exactly" class="MsoNormal"><span lang="EN-US" style="font-size:10.0pt;font-family:&quot;新細明體&quot;,&quot;serif&quot;;mso-ascii-theme-font:
minor-fareast;mso-fareast-theme-font:minor-fareast;mso-hansi-theme-font:minor-fareast">&nbsp;</span></p>	                	            </div>
