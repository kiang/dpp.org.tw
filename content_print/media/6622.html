				<h2>原4日新北市蔡英文後援會成立大會延期舉行</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 民進黨發言人王閔生今(2)日下午表示，鑑於新北市發生塵爆公安意外，考量社會氣氛及民進黨中央與各執政縣市現階段刻正全力協助傷者醫療及家屬生活等後續支援工作。因此近日部分大型競選活動，暫緩舉行，一切以協助災後各項支援為重。原定本週六（7月4日）下午舉行之新北市蔡英文後援會成立大會因而延期舉行，相關活動資訊競選辦公室將另行宣布。 &nbsp;</p>
