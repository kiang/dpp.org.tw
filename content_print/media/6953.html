				<h2>吳釗燮感謝美國眾議員夏波提出決議案，重新確認「六項保證」為台美關係基石</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 民主進步黨秘書長吳釗燮於今（30）日表示，感謝美國眾議院前外交事務委員會亞太事務小組委員會主席、眾議員夏波（Steve Chabot，R-OH）於10月28日提出決議案，重新確認「台灣關係法」與「六項保證」為台美關係基石。</p>
<p class="p2">&nbsp;</p>
<p class="p1">&nbsp; &nbsp; &nbsp; 吳秘書長表示，民進黨堅信「台灣關係法」與「六項保證」是維護台灣民主與台灣海峽和平的重要保證。他說，民進黨期待未來與美國和美國國會中長期支持台灣的友人，發展更強健的夥伴關係，並以自由和民主等共享價值為基礎，深化彼此在穩固區域安全的共同利益。</p>
<p class="p1">&nbsp;</p>
