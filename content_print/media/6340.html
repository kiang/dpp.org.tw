				<h2>針對南檢起訴郭信良之聲明稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;&nbsp;&nbsp;&nbsp; 針對台南地檢署起訴台南市正副議長李全教及郭信良一案，民主進步黨發言人鄭運鵬今（26）日表示，民進黨對於檢察官偵辦犯罪，向來期待檢方勿枉勿縱、公正辦案，今天台南地檢署起訴台南市議長李全教及副議長郭信良，其中郭信良為民進黨籍，依黨章規定，將移送廉政委員會處理。<br />
<br />
&nbsp;&nbsp;&nbsp;&nbsp; 鄭運鵬說，民進黨廉政委員會將於本周三開會，將盡速對於郭信良進行處理，而依據廉政條例規定，黨員違反廉政行為得為停權及最重除名之處分。</p>
