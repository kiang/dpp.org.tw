				<h2>民主進步黨針對中方將阻撓台灣參與國際民航組織(ICAO)大會之回應</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對傳出中方將阻撓台灣參與國際民航組織(ICAO)大會，民主進步黨發言人黃適卓今(21)日表示，參與國際民航組織大會（ICAO），攸關台灣獲取最新國際飛航安全資訊之重要管道；我政府已表達爭取參加今年ICAO的意願，並向對岸釋出最大善意，進行溝通協調，希望北京當局能正視和理解台灣民眾對於飛航安全的需求。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 為此黃適卓強調，「溝通與對話」才是處理兩岸爭議的正本清源之道。民主進步黨呼籲中國大陸，勿因政治因素，破壞了兩岸既有成果及兩岸人民的福祉權益。</div>
