				<h2>民進黨族群部發起送暖流到梨山活動</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt; COLOR: black">民進黨中央黨部族群事務部主任楊長鎮今日表示，對於七二水災帶來山區居民及原住民部落的災損，族群部特別選擇梨山災區進行援助，今日發起「送暖流到梨山」的活動，希望各界可以踴躍捐贈礦泉水、麵包、罐頭、蠟燭等物資，給梨山受困的居民，並希望民眾能提供四輪驅動車輛載送物資，請熱心民眾於今晚</span><span style="FONT-SIZE: 9pt; COLOR: black">21:00</span><span style="FONT-SIZE: 9pt; COLOR: black">前將物資送至民進黨族群部，族群部將於明天清晨</span><span style="FONT-SIZE: 9pt; COLOR: black">4:30</span><span style="FONT-SIZE: 9pt; COLOR: black">集合後送至梨山災區，送暖流到梨山的愛心專線電話為</span><span style="FONT-SIZE: 9pt; COLOR: black">02-2392-9989</span><span style="FONT-SIZE: 9pt; COLOR: black">轉</span><span style="FONT-SIZE: 9pt; COLOR: black">328</span><span style="FONT-SIZE: 9pt; COLOR: black">以及</span><span style="FONT-SIZE: 9pt; COLOR: black">0932-135-875</span><span style="FONT-SIZE: 9pt; COLOR: black">。</span></div>
<div style="TEXT-JUSTIFY: inter-ideograph; LAYOUT-GRID-MODE: char; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt">&nbsp;</div>	                	            </div>
