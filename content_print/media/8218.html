				<h2>民主進步黨選舉對策委員會第22次會議新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>
	民主進步黨選舉對策委員會今(6)日下午召開第22次會議，發言人何孟樺轉述會議結論，會中針對宜蘭縣、嘉義縣、台南市、高雄市四個縣市長初選選區協調結果進行說明。另選對會也對地方黨部提請建議之直轄市議員提名名額，審慎討論，相關意見將於明天中執會中報告。</p>
<p>
	何孟樺轉述，選對會特別重申，針對嘉義縣、台南市、高雄市三個縣市長初選選區，希望參選同志可以秉持初衷，在初選階段認真從事競選活動，多闡述政策理念，爭取選民最大的支持，避免互相攻訐。也期望各參選人能展現君子風度，不要讓支持者感到焦慮，並為未來初選民調後的整合，營造團結氣氛。</p>
