				<h2>民主進步黨針對「憲兵非法搜查」事件之聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對憲兵非法進入民宅進行搜查一事，民主進步黨發言人楊家俍今（6）日表示，憲兵單位這種做法，無法想像發生在任何民主國家，這已嚴重逾越憲兵職責，我們對此違法濫權、侵犯人權的行徑予以譴責。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 楊家俍表示，這是嚴重違反人權的事件，主管機關應該出面說明，嚴懲失職人員，並確保不再有任何違反人權之行為。為此，本黨也要求立院黨團落實監督，務必明確真相，徹查並杜絕不法濫權。</div>
