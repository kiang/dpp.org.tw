<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt">本黨對憲政改革負有特殊歷史使命，故積極參與本次修憲。本黨國大黨團自去年國發會結束後，即不斷進行各項修憲議題之研討、辯論、整合及協商，不折不撓，倍極辛勞。中常會對國大黨團的努力高度肯定，並致最高的敬意和嘉慰。<span lang="EN-US"><o:p></o:p></span></span></p>
