				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對今（14）日晚間日本熊本縣等地發生強烈地震，民進黨發言人阮昭雄稍早表示，蔡主席在得知日本震災消息後非常關心，並在第一時間請吳釗燮祕書長聯繫日本交流協會，了解震災情況並致上我方最誠摯的關切與慰問，希望地震帶來的災情能降到最少，日本的朋友們都能平安。</p>
