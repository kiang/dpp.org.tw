				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt">中央輔選八人小組於今天（<span lang="EN-US">9</span>月<span lang="EN-US">2</span>日）集會，會中作成如下決議：<span lang="EN-US"><o:p></o:p></span></span></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 25pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;; LETTER-SPACING: 0.75pt; mso-bidi-font-family: 新細明體; mso-font-kerning: 0pt">建請明天中執會（<span lang="EN-US">9</span>月<span lang="EN-US">3</span>日）徵召蔡同榮中常委參選嘉義市長，蔡鴻章中評委參選嘉義市補選立委，並委由八人小組的張俊宏、洪奇昌、周伯倫先行與二人展開溝通、徵詢、說服二人接受黨的徵召，以利民進黨在嘉義市的全面開拓。今日與會者有主席許信良、政策會主委張俊宏、秘書長邱義仁、立委洪奇昌、立委周伯倫等五位。<br /><br /><br /><br /><br /><br /><br /><span lang="EN-US"><o:p></o:p></span></span></p>	                	            </div>
