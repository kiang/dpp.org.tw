				<h2>尼伯特風災 民進黨：拋磚引玉捐款五十萬助台東</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 尼伯特颱風重創台東地區，民主進步黨發言人王閔生今(9)日表示，為呼籲社會各界共同關心並協助台東災後重建工作，除民進黨立院黨團捐助五十萬元外，民進黨中央黨部也以蔡英文主席名義同步捐款五十萬元，拋磚引玉以協助台東縣的災後重建工作。王閔生表示，黨秘書長洪耀福指示捐款作業於星期一上午辦理，希望各界共同關心並協助台東鄕親。</p>
