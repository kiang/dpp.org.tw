				<h2>媒體報導寇謐將（Michael Cole）說法 阮昭雄：屬個人臆測，並非事實</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對媒體報導「諾丁漢大學中國政策研究所高級研究員寇謐將（Michael Cole）受訪指出，民進黨總統候選人蔡英文已和北京一些有影響力的人士對話，可能已探究一些（九二共識之外）其他選項」云云，民進黨發言人阮昭雄今(31)日表示，上述說法純屬其個人臆測，並非事實，民進黨特此澄清，故請各媒體切勿引用，以免誤導視聽。</p>
