				<h2>民進黨：不要利用敦厚善良的計程車運將，製造社會衝突對立</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對媒體報導警方接獲情資，有統派團體明天將發動計程車司機「送機」示威，滋擾蔡主席訪美行程一事，民主進步黨發言人鄭運鵬今(28)日表示，中央黨部已從警方獲知相關訊息，我們認為民主國家應包容人民的多元意見，民進黨尊重人民集會及意見表達的自由。但根據相關資訊，背後主事者並不單純，為此，鄭運鵬表示，此舉恐引發不必要的社會對立與衝突，本黨呼籲背後主導者自我克制，不要利用敦厚善良的計程車運將朋友，製造社會衝突對立。此外，鄭運鵬也強調，本黨反對衝突與暴力，呼籲黨員應避免參與明天的現場活動，以免成為製造衝突的藉口。</p>
