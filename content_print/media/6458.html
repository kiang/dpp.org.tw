				<h2>鄭運鵬：陸委會淪為國民黨大陸事務部，自失分寸！  </h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對陸委會今天（10）日晚上發新聞稿批評民進黨主席蔡英文關於兩岸政策談話。民主進步黨發言人鄭運鵬表示，過去幾年來，就是因為馬政府把兩岸關係當作國共關係在處理，才會引起人民普遍的不信任和憤怒，馬政府的兩岸政策就是失敗的政策。陸委會身為國家執行兩岸政策機關，卻不顧行政中立，把人民放在一邊，以執政黨的立場為立場，抱殘守缺，自甘成為執政黨批評的傳聲筒，讓行政院的陸委會淪為國民黨大陸事務部，這種自失分寸的行徑，也難怪人民根本無法信賴馬政府的兩岸政策。</p>	                	            </div>
