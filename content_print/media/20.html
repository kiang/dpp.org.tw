				<h2>敦促外交部或僑務單位應撤銷對暴力份子鄧康的表揚</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">

	                <p class="MsoNormal" style="MARGIN: 9.5pt 0cm; TEXT-INDENT: 22pt; LINE-HEIGHT: 20pt; mso-para-margin-top: .5gd; mso-para-margin-right: 0cm; mso-para-margin-bottom: .5gd; mso-para-margin-left: 0cm; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'"></span><span lang="EN-US" style="FONT-SIZE: 10pt"><o:p></o:p></span></p>

<p class="MsoNormal" style="MARGIN: 9.5pt 0cm; TEXT-INDENT: 22pt; LINE-HEIGHT: 20pt; mso-para-margin-top: .5gd; mso-para-margin-right: 0cm; mso-para-margin-bottom: .5gd; mso-para-margin-left: 0cm; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">美國洛杉磯北美事務協調處聘請三名越南華僑為榮譽顧問，其中一位被表揚頒獎者鄧康，曾於一九九一年歡迎鄭心雄的餐會上，拳打前南加州台灣同鄉聯合會會長江昭儀。這種榮譽顧問之聘請，可謂漠視海外台灣僑胞的權益。施行暴力者又獲得表揚，更是侮辱台灣僑民的尊嚴。本黨發言人蘇貞昌秘書長，對此表示嚴厲譴責。</span><span lang="EN-US" style="FONT-SIZE: 10pt"><o:p></o:p></span></p>
<p class="MsoNormal" style="MARGIN: 9.5pt 0cm; TEXT-INDENT: 22pt; LINE-HEIGHT: 20pt; mso-para-margin-top: .5gd; mso-para-margin-right: 0cm; mso-para-margin-bottom: .5gd; mso-para-margin-left: 0cm; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span lang="EN-US" style="FONT-SIZE: 10pt"><o:p><font face="Times New Roman">&nbsp;</font></o:p></span><span style="FONT-SIZE: 10pt; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">蘇貞昌秘書長已責成中央黨部組織部行文本黨立法院黨團，就此事件嚴予質詢，敦促外交部或僑務單位應撤銷對暴力份子鄧康的表揚，並且撤聘洛杉磯北美事務協調處榮譽顧問。</span><span style="FONT-SIZE: 10pt"><font face="Times New Roman"> <span lang="EN-US"><o:p></o:p></span></font></span></p>
