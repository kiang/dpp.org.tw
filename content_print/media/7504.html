				<h2>民進黨：翁院長應該儘速向社會完整交代，以維護國家學術機構的名譽</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對今(31)日上午媒體詢及中研院長翁啟惠請辭一事，民進黨發言人阮昭雄表示，無論翁啟惠院長是否請辭，我們認為身為國家最高學術機構的負責人，面對近來社會上的諸多質疑，他有責任出面說明，釐清各項疑點，不該迴避。因為這不僅是個人的名譽問題，更是整個社會對於中研院信任的重大挑戰。對此民進黨呼籲，翁院長應該儘速向社會完整交代，以維護國家學術機構的名譽。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 至於媒體詢及本黨對於翁啟惠院長請辭的看法，阮昭雄表示，我們尊重馬總統的決定。</div>
