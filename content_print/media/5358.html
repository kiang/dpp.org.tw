				<h2>林益世案宣判，林俊憲：判決結果不利於重建人民對司法的信任</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p style="text-align: justify;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 對於台北地方法院今 （30）日針對前行政院秘書長林益世所涉案件之一審審判結果，民主進步黨發言人林俊憲傍晚受訪表示，外界對檢調偵辦過程有非常多的質疑，進而影響到今天這 樣一個完全不符社會期待的判決結果，並與多數民眾的認知有極大的落差。林俊憲強調，司法要獨立，要能獲得人民的信任，必須建立在公平、公正的審判結果，今 日的判決結果讓社會對政黨因素有很大的想像空間，也不利於重建人民對司法的信任。</p>
