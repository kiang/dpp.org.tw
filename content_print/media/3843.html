				<h2>民主進步黨第七屆第59次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>民主進步黨第七屆第59次中常會新聞稿<br />
<br />
一、甫於1月24日選出的縣市議員將於3月1日宣誓就職，隨即選出縣市議會議長、副議長。中常會今日就即將到來的議長、副議長選舉展開熱烈討論，中常委一致認為民進黨清廉執政、清明選舉的傳統必須予以確保，不容任何賄選行為污染。常會並做成決議：<br />
<br />
1.嚴禁黨籍縣議員有任何涉及賄選之行為，否則從嚴議處。<br />
<br />
2.責成組織部了解各縣市具體狀況，執政縣市諮詢縣市長意見後，擬具具體建議方案，下週提報常會討論。 <br />
<br />
&nbsp;<br />
&nbsp;<br />
&nbsp;<br />
<br />
&nbsp;</p>	                	            </div>
