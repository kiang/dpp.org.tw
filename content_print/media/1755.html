				<h2>水蓮風衣沒有違規是正常的選舉商品</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">針對今天蘋果日報載副總統的競選服裝「水蓮裝」出現違規義賣一事，陳水扁總部新聞部主任鄭文燦提出嚴正反駁，鄭文燦指出，水蓮風衣是「水蓮人間文教股份有限公司」所發行，這是領有營利事業登記證的公司，和「扁帽工廠」性質類似，而「水蓮風衣」的定價也非</span><span style="FONT-SIZE: 9pt">5000</span><span style="FONT-SIZE: 9pt">元，而是</span><span style="FONT-SIZE: 9pt">2000</span><span style="FONT-SIZE: 9pt">元，義賣的盈餘提供選舉活動之用，並無不可。鄭文燦說，媒體報導未經查證，顯有妨害副總統名譽及影響選情之虞，為法所不容，特此嚴正聲明。</span></div>
