				<h2>就職紀念酒曝光？！ 阮昭雄：未授權製作總統就職相關紀念商品</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對媒體昨日刊載「慶祝上任，蔡英文520就職紀念酒曝光」報導，民進黨發言人阮昭雄今(17)日表示，報載的這項紀念酒商品為私人酒廠自行製作，並不是黨部、總統就職活動籌備團隊設計製作，事實上該廠商也未曾就此與我方聯繫，更沒有取得任何的授權。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 阮昭雄說，為了避免混淆，甚至造成消費者權益受到傷害，黨部特別在此提出說明，也請這些廠商遵守相關的法律規定。</div>
