				<h2>民主進步黨第二十一屆第十六次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>民主進步黨今（4）日召開第二十一屆第十六次中常會，韓瑩轉述林右昌秘書長於會中黨務報告，林右昌秘書長將於12月7日至10日，代表黨主席賴清德出訪日本，此行將聚焦於政黨外交，與自民黨、立憲民主黨、國民民主黨、日本維新會等主要政黨領導幹部及重要國會議員交流，進一步強化政黨關係、台日發展。</p>

<p>林右昌指出，另也代表賴主席感謝日本信賴之友、台灣僑胞對本黨的支持，將於行程安排大阪及東京兩場僑團演說、座談，向僑界傳達本黨執政理念，交換國政意見。此行將聚焦於政黨外交，進一步強化雙邊政黨關係、台日發展。為台灣整體外交關係打下更好的基礎。</p>
