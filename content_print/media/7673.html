				<h2>針對游蕙禎向蔡英文總統發出信件之回應</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對游蕙禎今（22）日向蔡英文總統發出的信件，民主進步黨回應如下：</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 對於香港人民積極推動香港民主自由的理念，民進黨予以肯定和支持，也希望港府能傾聽民意，在內部的和諧環境下，追求進步與繁榮。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 民進黨也呼籲中共當局，應落實一國兩制中，對於「港人治港、高度自治」的承諾，正視港人對於自由、民主、法治等核心價值的追求，並以耐心積極和香港人民進行溝通，讓香港的民主持續進步與發展。</div>
