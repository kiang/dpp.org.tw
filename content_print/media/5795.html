				<p class="news_content_date">2014-03-21</p>
				<h2>張惇涵：包圍行動告一段落，感謝公民團體同意本黨使用場地</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;</p>
<p><!--[if !mso]>

<p align="center" style="text-align:center;text-indent:30.0pt;
mso-char-indent-count:2.0" class="MsoNormal"><span lang="EN-US" style="font-family: 標楷體;">&nbsp;</span></p>
<p style="text-align:justify;text-justify:inter-ideograph;
text-indent:30.0pt;mso-char-indent-count:2.0" class="MsoNormal"><span style="font-family: 標楷體;">民進黨發言人張惇涵今<span lang="EN-US">(21)</span>日晚間表示，今天本黨於周邊發動的包圍立院行動，已於今晚九點告一段落，民進黨要向經協調同意本黨使用台北市濟南路部分路段的反黑箱服貿民主平台等公民團體，表示謝意。</span></p>
<p style="text-align:justify;text-justify:inter-ideograph;
text-indent:30.0pt;mso-char-indent-count:2.0" class="MsoNormal"><span lang="EN-US" style="font-family: 標楷體;">&nbsp;</span></p>
<p style="text-align:justify;text-justify:inter-ideograph;
text-indent:30.0pt;mso-char-indent-count:2.0" class="MsoNormal"><span style="font-family: 標楷體;">張惇涵說，為了滿足公民團體及學生進一步規劃整體行動的需求，民進黨在今夜完成清潔等善後工作後，即將該區塊空間歸還給公民團體，未來本黨只會保留一處黨公職聯絡中心，供相關服務及聯繫使用。</span></p>
