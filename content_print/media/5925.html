				<h2>林俊憲：嚴厲譴責馬政府違法濫權的行徑</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp;<span style="color: rgb(34 34 34); font-family: 新細明體 serif; line-height: 20pt; text-indent: 32.05pt;">針對今</span><span lang="EN-US" style="color: rgb(34 34 34); font-family: 新細明體 serif; line-height: 20pt; text-indent: 32.05pt;">(24)</span><span style="color: rgb(34 34 34); font-family: 新細明體 serif; line-height: 20pt; text-indent: 32.05pt;">日上午傳出國安與警務人員對投宿旅館民眾強制破門一事，民進黨發言人林俊憲表示，國安人員對民眾恣意破門並限制其行動，已是嚴重違法濫權、侵犯人權的行徑，民進黨除了要表示嚴厲的譴責，也已經請本黨立院黨團向相關單位提出嚴正的關切及強力監督。林俊憲說，馬政府不應該濫用國家機器，限制人民意見表達的權利及行動的自由，尤其在國際旅館這樣的場所對我國人民採取戒嚴式、濫權的措施，還將嚴重傷害台灣的國際形象。</span></p>
