				<h2> 針對今日《蘋果日報》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 針對《蘋果日報》今（5）日報導「蔡英文挑副手 「清白無聲」」，並有所謂「接近蔡英文人士」說法云云，民進黨發言人阮昭雄表示，感謝各界對此議題的關心，但依照黨的慣例，相關問題都尊重總統候選人的決定，目前也還不到決定的時候。&nbsp;</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 至於報導中有所謂「接近蔡英文人士」、「副手條件」等，阮昭雄則表示，既然一切尊重候選人，就應以候選人的說法為準，所謂的「近蔡人士」的條件說，純屬臆測，並不是事實。</div>
