				<h2>針對今日《中國時報》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal"><span lang="EN-US">&nbsp;</span><span lang="EN-US">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;&#10;mso-hansi-font-family:&quot;Times New Roman&quot;">針對今</span><span lang="EN-US">(18)</span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;mso-hansi-font-family:&#10;&quot;Times New Roman&quot;">日《中國時報》</span><span lang="EN-US">A2</span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;mso-hansi-font-family:&#10;&quot;Times New Roman&quot;">版標「藍委防馮世寬</span> <span style="font-family:新細明體;mso-ascii-font-family:&#10;&quot;Times New Roman&quot;;mso-hansi-font-family:&quot;Times New Roman&quot;">重演鐽震案</span> <span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;mso-hansi-font-family:&#10;&quot;Times New Roman&quot;">今審國防部小金庫」報導，民進黨發言人王閔生表示，「鐽震案」經過多年司法調查，早已證實沒有不法，是政治抹黑，而事實上馮準部長當年主持「翔展案」，更是近年來國防自主成功的案例，馬總統也親自參與成軍典禮。</span><span lang="EN-US"><o:p></o:p></span></p>
<p class="MsoNormal"><span lang="EN-US">&nbsp;</span></p>
<p class="MsoNormal"><span lang="EN-US">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;&#10;mso-hansi-font-family:&quot;Times New Roman&quot;">有關立法院外交國防委員會今天審「國防工業發展基金會」，王閔生說，這項</span><span lang="EN-US">77</span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;&#10;mso-hansi-font-family:&quot;Times New Roman&quot;">億元的相關預算，是馬政府所提列，相關預算皆受立院實質監督與審查，外界無須做過多揣測與沒有事實根據的聯想。</span></p>
