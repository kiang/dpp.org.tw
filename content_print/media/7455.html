				<h2>美國已故總統雷根夫人南西雷根逝世 民進黨表達哀悼</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 美國已故總統雷根夫人南西雷根（Nancy Reagan）不幸於今（7）晨因病逝世，享年94歲，民主進步黨對此深表哀悼之意。</p>
<p class="p2">&nbsp;</p>
<p class="p1"><span class="s1">&nbsp; &nbsp; &nbsp; 雷根夫婦長期與台灣保持友好關係，他們曾於1971年代表尼克森總統訪台出席雙十國慶，並於1978年再度訪台。對於南西雷根辭世，民進黨深感哀傷與悼念。</span></p>
