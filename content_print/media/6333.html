				<h2>民進黨對阿布杜拉國王逝世表達誠摯哀悼  </h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 沙烏地阿拉伯國王阿布杜拉在當地時間凌晨一時逝世，民主進步黨主席蔡英文致函沙烏地阿拉伯駐台代表處表達哀悼之意。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; &nbsp;蔡主席表示，沙烏地阿拉伯一直是中東國家的領導國，阿布杜拉國王也在區域與世界政治上扮演舉足輕重的角色。台灣與沙烏地阿拉伯長年友好，長期以來在貿易投資，科技合作，電力，交通，農業，醫療與教育訓練等領域合作密切。相信兩國未來一定會繼續深化雙邊友好關係。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 蔡主席代表民進黨對阿布杜拉國王的逝世表達最誠摯的哀悼。&nbsp;</div>
