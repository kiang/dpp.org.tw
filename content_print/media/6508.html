				<h2>針對中時錯誤報導本黨聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; &nbsp;針對中國時報今天刊載「成立闇黑小組打馬貪腐」報導，民進黨發言人王閔生表示，這則報導充滿故事性與豐富想像力，但都不是事實，新聞編採中也沒有向黨部相關部門查證，王閔生說，畢竟新聞是為了傳真事實，對於中時這樣的不實報導，民進黨感到相當遺憾，並要求該報立即更正，以免國人受到誤導。</p>
