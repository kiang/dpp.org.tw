				<h2>民進黨：堅持南海主權，立場不會改變</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對馬總統將赴太平島巡視宣示主權並邀請民進黨派員一事，民主進步黨發言人楊家俍今（27）日表示，民進黨基於對體制的尊重，所以沒有派員隨同前往。對於南海議題，蔡主席已經多次表示，民進黨堅持南海主權，這個立場不會改變，我們主張依據國際法及海洋法公約來處理相關爭議。民進黨認為，身為區域的一份子，我們有責任與各方共同來維護區域的和平與穩定。</p>
