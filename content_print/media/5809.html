<div>&nbsp; &nbsp; 針對反黑箱服貿學運發展，民進黨今（27）日發佈相關聲明：</div>
<div>一、<span class="Apple-tab-span" style="white-space:pre">	</span>民進黨尊重學運主體性，基於與學運訴求理念相同，民進黨號召全民響應學生於3月30日之行動。</div>
<div>二、<span class="Apple-tab-span" style="white-space:pre">	</span>民進黨嚴格要求當天參與活動的黨公職及同志不得穿著具有政治符號之背心及服裝、不得攜帶黨旗與個人旗幟、並不得駕駛宣傳車前往現場。</div>
