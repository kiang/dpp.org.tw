				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對婚姻平權立法推動，民主進步黨發言人王閔生今(28)日表示，本黨支持婚姻平權的立場與態度沒有改變，我們和所有朋友站在一起，堅持力挺彩虹權益。至於有關婚姻平權的各項法案，現在已經在國會中進行討論，我們樂見並且期待社會有更多的對話和包容，讓制度更加完善。</p>
