				<h2>對今日《蘋果日報》報導的澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;<span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">針對今</span><span lang="EN-US" style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">(12)</span><span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">日《蘋果日報》</span><span lang="EN-US" style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">A10</span><span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">政治版「綠推對比民調，柯料出線」報導內容稱「根據綠營內部最新一份民調顯示，最適合代表綠營出戰的人選依次為台大醫師柯文哲約近四成，前副總統呂秀蓮一成七，律師顧立雄一成三，立委姚文智一成一，立委許添財不到一成」云云，民進黨發言人張惇涵今（</span><span lang="EN-US" style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">12</span><span style="font-family: 新細明體 serif; font-size: 10pt; line-height: 20pt; text-align: justify; text-indent: 22pt;">）日表示，該報導所稱「綠營內部最新一份民調」，絕非民進黨中央黨部所做的民調，中央黨部近日也沒有做這樣的民調，為免讀者及各界誤解，民進黨中央黨部特此澄清，敬請媒體朋友及各界明察。</span></p>
