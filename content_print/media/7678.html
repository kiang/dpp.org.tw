				<h2>秋鬥提改革訴求 民進黨：持續與社會各界溝通</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對秋鬥團體今(27)日稍早表達的各項訴求，民主進步黨發言人楊家俍表示，我們充分了解人民對台灣社會的改革有很深的期待，相信政府對今天的各項訴求也列為施政重要參考，並會全力以赴，持續並加速推動相關政策與改革。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 楊家俍表示，各項重要改革方案都持續推動中，在改革進行的同時，我們也會協助政府持續與社會各界溝通，期待能加速推動包括勞工、兒少、公托、住宅、青年、長照政策與年金改革等各項改革進程，回應人民的期待。</div>
