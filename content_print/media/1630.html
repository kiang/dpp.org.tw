				<h2>吳乃仁：連戰騙票，誰來買單？</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div style="TEXT-JUSTIFY: inter-ideograph; MARGIN: 0cm 0cm 12pt; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt"><span style="FONT-SIZE: 9pt">陳水扁競選總部發言人吳乃仁</span><span style="FONT-SIZE: 9pt">(13</span><span style="FONT-SIZE: 9pt">日</span><span style="FONT-SIZE: 9pt">)</span><span style="FONT-SIZE: 9pt">指出，中央政府總預算每年約</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">兆</span><span style="FONT-SIZE: 9pt">4000</span><span style="FONT-SIZE: 9pt">億，但連戰至今所開出的選舉支票就要</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">兆</span><span style="FONT-SIZE: 9pt">2429</span><span style="FONT-SIZE: 9pt">億，其中單是委任公務員調薪方案，每年就要增加</span><span style="FONT-SIZE: 9pt">1900</span><span style="FONT-SIZE: 9pt">億預算。</span><span style="FONT-SIZE: 9pt"><br /><br /></span><span style="FONT-SIZE: 9pt">發言人吳乃仁表示，目前中央政府每年總預算大約是</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">兆</span><span style="FONT-SIZE: 9pt">4000</span><span style="FONT-SIZE: 9pt">億，但連戰至今所開出的選舉支票，若不包括</span><span style="FONT-SIZE: 9pt">4</span><span style="FONT-SIZE: 9pt">年</span><span style="FONT-SIZE: 9pt">2</span><span style="FONT-SIZE: 9pt">兆計畫，就要國庫再多支出</span><span style="FONT-SIZE: 9pt">9856</span><span style="FONT-SIZE: 9pt">億元，佔政府總預算的</span><span style="FONT-SIZE: 9pt">70%</span><span style="FONT-SIZE: 9pt">，平均每位台灣人民</span><span style="FONT-SIZE: 9pt">(</span><span style="FONT-SIZE: 9pt">包括剛出生的嬰兒</span><span style="FONT-SIZE: 9pt">)</span><span style="FONT-SIZE: 9pt">就要負擔</span><span style="FONT-SIZE: 9pt">4</span><span style="FONT-SIZE: 9pt">萬</span><span style="FONT-SIZE: 9pt">3</span><span style="FONT-SIZE: 9pt">千元，若計入</span><span style="FONT-SIZE: 9pt">4</span><span style="FONT-SIZE: 9pt">年</span><span style="FONT-SIZE: 9pt">2</span><span style="FONT-SIZE: 9pt">兆計畫，連戰所開選舉支票就要</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">兆</span><span style="FONT-SIZE: 9pt">4856</span><span style="FONT-SIZE: 9pt">億，這些支票都是連戰為了選舉騙票，才開出來的，但是我們要問：誰來買單呢？</span></div>	                	            </div>
