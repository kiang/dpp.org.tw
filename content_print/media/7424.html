				<h2>民進黨：拋磚引玉，祈願傷者早日度過難關</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp;&nbsp;<span style="font-family: 新細明體;">民主進步黨發言人楊家俍今</span><span lang="EN-US">(6)</span><span style="font-family: 新細明體;">日轉述蔡英文主席於災害應變會議指示，民進黨對高雄大地震災害的災民表達最大的關心，祈願傷者能夠早日度過難關。有鑑於此次意外傷患的醫療及災後復原重建所需經費龐大，中央黨部也鼓勵所有民眾踴躍捐輸，將善款捐往台南市社會救助金專戶專戶（帳號：</span><span lang="EN-US">009045065055 </span><span style="font-family: 新細明體;">臺灣銀行台南分行。匯款單上加註指定用途「</span><span lang="EN-US">0206</span><span style="font-family: 新細明體;">震災」）</span></p>
<p class="MsoNormal"><span lang="EN-US">&nbsp;</span></p>
<p class="MsoNormal"><span lang="EN-US">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span><span style="font-family:新細明體;mso-ascii-font-family:&quot;Times New Roman&quot;;
mso-hansi-font-family:&quot;Times New Roman&quot;">為此，蔡英文主席個人捐款一百萬元、民進黨中央黨部捐款三百萬元、民進黨立院黨團捐款一百萬元，藉此拋磚引玉。至盼全國民眾同心協力以度過難關。</span></p>
