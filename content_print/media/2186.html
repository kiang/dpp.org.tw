				<h2>陳德生同志褒揚文</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; TEXT-INDENT: 20pt; LINE-HEIGHT: 20pt; mso-char-indent-count: 2.0; mso-line-height-rule: exactly"><span style="FONT-SIZE: 10pt; FONT-FAMILY: &quot;新細明體&quot;,&quot;serif&quot;">陳德生同志為本黨創黨黨員，在建黨時期，不辭辛勞，宣揚本黨政治理念，爭取廣大社會支持，為本黨不可多得之資深同志。陳同志於擔任基隆市議員期間，表現清廉、認真，不幸遭到謀害，黨內外同感悲憤。台灣痛失一位傑出政治運動者，本黨痛失一位可貴戰友。在政局險惡環境中，陳同志秉持民主精神，堅持反對立場，已為本黨立下典範。無懼無畏，貫澈始終，乃是陳同志為本黨留下之精神遺產。全體黨員懷念陳同志風範，肯定其生前之努力奮鬥。陳同志雖已離去，傲骨依舊，精神永存，特此褒揚。<br /><br /><br /><br /><span lang="EN-US"><o:p></o:p></span></span></p>	                	            </div>
