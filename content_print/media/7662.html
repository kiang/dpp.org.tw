				<h2>針對《聯合晚報》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對《聯合晚報》今(11)日「川普幕僚訪台 駐美代表處：不是川普派的」之報導，民主進步黨國際部主任羅致政表示，民進黨駐美代表處未參與川普幕僚訪臺計畫，媒體相關報導並不正確，應以外交部長李大維說詞為準。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 羅主任表示，無論是美國共和黨或民主黨，兩黨都曾有代表赴臺並拜訪民進黨主席，這都是公開資訊，過去也有新聞報導過。在川普當選的美國新局勢，盼特定媒體勿再炒作此議題，應該以國家利益為優先。</div>
