				<h2>前黨工李明哲在中國大陸失蹤 民進黨：中國大陸必須儘速公佈李明哲行蹤</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 針對文山社區大學學程經理人、本黨前同仁李明哲先生在中國大陸失蹤一案，民主進步黨發言人王閔生今（28）日表示，民進黨呼籲中國大陸，基於人權立場，必須儘速公佈李明哲的行蹤消息，確保李明哲的人身安全；有關單位應遵守正當法律程序，及時回應家屬需求，以解家屬的憂慮。</p>
