				<h2>民主進步黨第十七屆第一次中常會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 民主進步黨今(27)日召開第十七屆第一次中常會，會中邀請桃園市長鄭文燦以「『領航桃園＊智慧城市』桃園城市交流經驗」為題進行專案報告。發言人黃適卓會後轉述蔡英文主席聽取報告後表示繼續努力來推動城市交流及發展。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 此外，會中通過聘任陳勝宏中常委續任財務委員會主委，林聰賢、林佳龍、黃金春中常委擔任人事評議委員會委員，依規定，秘書長洪耀福及財委會主委陳勝宏為人事評議委員會當然委員，且秘書長為召集人。會中也通過由陳明文、陳亭妃、蔡憲浩、沈發惠、潘孟安中常委擔任入黨複審小組成員，並由陳明文中常委擔任召集人。</div>
