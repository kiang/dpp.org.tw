				<h2>台南市長初選提名協調會議新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <body id="cke_pastebin">
	<p>
		民主進步黨選舉對策委員會召集人林錫耀今(25)日召集台南市提名初選之參選人葉宜津、黃偉哲、顏純左、李俊毅、王定宇、陳亭妃，召開初選提名協調會議。</p>
	<p>
		發言人鄭運鵬轉述會議決議，會中六位參選人皆同意初選階段會維持黨內團結，不互相攻訐；初選結束也會同心協力地支持黨提名候選人。另會中也針對初選民調進行協調，經六位參選人同意，將採取互比式民調。<o:p></o:p></p>
