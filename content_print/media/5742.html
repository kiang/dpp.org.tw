				<h2>2014年台北市長徵詢小組會議決議新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal" align="center" style="margin-left:18.0pt;text-align:center">&nbsp;</p>
<p class="MsoNormal" style="margin-left:18.0pt"><span style="font-size: medium;"><span lang="EN-US" style="font-family: 標楷體;">&nbsp; </span></span><span lang="EN-US" style="font-family: 標楷體;"><o:p></o:p></span></p>
<p class="MsoNormal" style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size: medium;"><span style="font-family: 標楷體;">民主進步黨<span lang="EN-US">2014</span>年台北市長徵詢小組今（<span lang="EN-US">20</span>）日召開第三次會議，會議做成決議如下：</span></span><span style="font-family: 標楷體;"><span lang="EN-US"><o:p></o:p></span></span></p>
<p class="MsoNormal" style="text-indent:30.0pt;mso-char-indent-count:2.0"><span style="font-size: medium;"><span lang="EN-US" style="font-family: 標楷體;">&nbsp;</span></span></p>
<p class="MsoNormal" style="margin-left:36.0pt;text-indent:-36.0pt;mso-list:l0 level1 lfo1"><span style="font-size: medium;"><!--[if !supportLists]--><span lang="EN-US" style="font-family: 標楷體;">一、<span style="font-family: 'Times New Roman';">&nbsp; </span></span><!--[endif]--><span style="font-family: 標楷體;">本<span lang="EN-US">2014</span>台北市長候選人徵詢小組的任務，是為本黨徵詢願意接受民進黨徵召參選台北市長之適當人選，現階段將呈報呂秀蓮前副總統、許添財委員、姚文智委員、周柏雅副議長、顧立雄律師等五位適當人選予中央黨部後，任務完成。</span></span><span style="font-family: 標楷體;"><span lang="EN-US"><o:p></o:p></span></span></p>
<p class="MsoNormal" style="margin-left:36.0pt"><span style="font-size: medium;"><span lang="EN-US" style="font-family: 標楷體;">&nbsp;</span></span></p>
<p class="MsoNormal" style="margin-left:36.0pt;text-indent:-36.0pt;mso-list:l0 level1 lfo1"><span style="font-size: medium;"><!--[if !supportLists]--><span lang="EN-US" style="font-family: 標楷體;">二、<span style="font-family: 'Times New Roman';">&nbsp; </span></span><!--[endif]--><span style="font-family: 標楷體;">未來民進黨產生台北市長候選人的方式與程序，及整合其他在野之參選人，為下一階段本黨之工作。</span></span></p>
<p>&nbsp;</p>	                	            </div>
