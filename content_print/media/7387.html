				<h2>民主進步黨哀悼長榮集團創辦人暨總裁張榮發先生</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; 對於長榮集團創辦人暨總裁張榮發先生今(20)日辭世，民主進步黨表示最誠摯的哀悼並向家屬致意。</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 發言人阮昭雄表示，張榮發先生創立長榮集團，是少數出身海洋的企業家。他一生刻苦樸實的人生哲學，劍及履及的做事態度，鋼鐵意志的創業精神，打造了世界第一的長榮集團。張榮發先生寫下傳奇的人生，可以說是最具代表性的台灣企業家，也將會是後人所學習景仰的成功典範。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 對於張榮發先生的辭世，讓台灣失去一位本土典範的企業家，他的成就與貢獻，會受台灣人所懷念。</div>
