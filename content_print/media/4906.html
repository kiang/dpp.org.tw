				<h2>陳菊：堅持社會公義，反對本外勞基本工資脫鉤</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;</p>
<div style="text-align: center; text-indent: 38.05pt" align="center"><span style="font-size: small"><b>陳菊：堅持社會公義，反對本外勞基本工資脫鉤</b></span></div>
<div style="text-indent: 30pt"><span style="font-size: small">對於藍營立委提案本、外勞基本工資脫鉤，民進黨代理主席陳菊今（22）日表示，民進黨秉持堅持社會公義、相挺弱勢人民的核心價值，強烈反對此一提案。</span></div>
<div><span style="font-size: small">&nbsp;</span></div>
<div style="text-indent: 30pt"><span style="font-size: small">陳菊代理主席認為，本、外勞工資脫鉤，不僅違背基本的人權價值，對外籍勞動者的權益造成歧視性傷害，將衝擊台灣國際形象，同時也將影響本國勞工權益，造成就業排擠與勞動條件跟隨下滑。陳菊也相信，台灣產業長期的競爭力，應奠基在創新之上。</span></div>	                	            </div>
