            <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt; TEXT-ALIGN: justify"><span style="FONT-SIZE: 9pt">一、<span style="FONT: 7pt 'Times New Roman'">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span><span style="FONT-SIZE: 9pt">十八歲的民進黨，以</span><span style="FONT-SIZE: 9pt">18</span><span style="FONT-SIZE: 9pt">的意象，構成一隻蝴蝶，代表我們破蛹而出、展翅高飛。代表了成長的喜悅、責任的承擔與未來的許諾。</span><span style="FONT-SIZE: 9pt">&nbsp;</span></div>
            <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt; TEXT-ALIGN: justify"><span style="FONT-SIZE: 9pt">二、<span style="FONT: 7pt 'Times New Roman'">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span><span style="FONT-SIZE: 9pt">民進黨的台灣認同，是民進黨的價值座標，因此，我們以台灣為</span><span style="FONT-SIZE: 9pt">1</span><span style="FONT-SIZE: 9pt">，以蝴蝶展翼為</span><span style="FONT-SIZE: 9pt">8</span><span style="FONT-SIZE: 9pt">，代表「台灣起飛」的改革進步意象。</span>&nbsp;</div>
            <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt; TEXT-ALIGN: justify"><span style="FONT-SIZE: 9pt">三、<span style="FONT: 7pt 'Times New Roman'">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span><span style="FONT-SIZE: 9pt">民進黨不是只有綠色，民進黨追求多元文化，因此，我們的色彩是五彩繽紛，包容每一個族群與文化。</span>&nbsp;</div>
            <div style="TEXT-JUSTIFY: inter-ideograph; TEXT-INDENT: 18pt; LINE-HEIGHT: 20pt; TEXT-ALIGN: justify"><span style="FONT-SIZE: 9pt">四、<span style="FONT: 7pt 'Times New Roman'">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; </span></span><span style="FONT-SIZE: 9pt">成年禮的意義：成長、責任、許諾。以最青春活潑的方式表達這組訴求。</span></div>
