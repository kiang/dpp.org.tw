				<h2>針對今日《時報週刊》報導之澄清與說明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 針對《時報週刊》今（27）日報導「蔡英文若選上總統　將找賴清德當閣揆」，民進黨發言人鄭運鵬上午表示，該則報導內容純屬臆測，過程中也沒有向我方查證、詢問相關回應，對於這樣的「報導」，民進黨感到遺憾，也要求《時報週刊》進行更正。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 鄭運鵬也表示，任何人事安排在時機成熟時都會正式對外說明，但民進黨日前才剛完成總統黨內提名的候選人資格審查，關於該報導所指之人事，現階段根本不可能有任何內部討論。為避免類似的不實報導造成混淆或誤解，鄭運鵬也呼籲媒體不要以臆測或傳聞替民進黨做人事安排。</div>
