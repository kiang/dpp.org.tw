				<h2>民進黨針對中國時報不實報導之聲明</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp; &nbsp; &nbsp; &nbsp;針對中國時報今（22）日刊載以「小英斥林義雄 講話卡有斬節」為題不實報導，民進黨聲明如下：</p>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 一、對於該報導刻意以不實文字為新聞標題，意圖誤導輿論，混淆視聽，本黨對於該報背離新聞專業倫理之行徑，表示嚴重抗議及譴責。</div>
<div>&nbsp;</div>
<div>&nbsp; &nbsp; &nbsp; 二、中國時報應交代事件原委，並以最快速度於網站、紙本進行更正、公開道歉。</div>
