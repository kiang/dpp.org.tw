				<h2> 民進黨中評會新聞稿</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <div>&nbsp; &nbsp; &nbsp; 今(25)日登場的縣市議會正副議長選舉，民主進步黨中央評議委員會針對選舉狀況未如預期的縣市，緊急行文要求各該黨團儘速召開黨團會議釐清問題所在，並速送中評會處理。主委劉世芳表示，六都議會部分大致都如預期，惟台南市、高雄市等兩個黨團疑有成員未依黨團要求進行一致性投票，待黨團會議結果出爐後，近日將加開中評會，對違紀黨員祭出最嚴厲之黨紀處分。</div>
