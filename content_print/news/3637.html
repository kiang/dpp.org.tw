                                                            <td class="c9" valign="top" width="100%" height="200">痛苦指數是用以衡量總體經濟表現不好的程度，等於失業率和通貨膨脹率加總之和。失業使人收入無著落、尊嚴受損；通貨膨脹則讓所得縮水、分配不均，兩者都會降低經濟效率，帶來社會不安。一般而言，失業率與通貨膨脹率愈低愈好，假若它們的值愈高，表示總體經濟的問題愈嚴重。因此，降低痛苦指數成為各國一致追求的目標。</td>
