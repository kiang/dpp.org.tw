				<h2>規劃和平條約 而非和平協議（姜皇池）</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>總統提出在（1）國家需要，（2）人民支持與（3）國會監督三條件下，將於未來十年內與中國簽署「和平協議」。追求和平，國人之所願，吾人亦感贊同，但此時此際，如此條件與安排，仍令人有所疑慮</p>
<p>「和平協議」則是旨在中止「一國」合法與叛亂團體、或是一國之內數個政治實體間的武裝衝突，簽署以避免生靈塗炭；換言之，「和平協議」屬於政府與叛亂團體締結之「聲明」（statements），不僅不屬1969年維也納《條約法公約》所規範，且用以確認系爭衝突為一國國內紛爭，交戰各方之領土同屬單一國家...<a href="http://tw.nextmedia.com/applenews/article/art_id/33753064/IssueID/20111020">全文閱讀</a></p>	                	            </div>
