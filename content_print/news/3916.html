				<h2>【青年黃金十年大夢】年輕夫妻不生小孩的背後</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p><span class="Apple-style-span" style="color: rgb(119, 119, 119); font-family: 'Lucida Grande', Geneva, Arial, Verdana, sans-serif; -webkit-border-horizontal-spacing: 2px; -webkit-border-vertical-spacing: 2px; ">余靜華 (台灣智庫副研究員)</span>&nbsp;&nbsp;&nbsp;&nbsp;</p>
<p>發高額津貼也好，托育公共化也好，生育率下降的根本原因是「台灣整體就業、生活環境，長期出了問題」。近十年國家「唯GDP發展」的經濟政策，只有財團賺到錢，人民平均所得卻無法提升，而托育費用又居高不下，孩子當然越生越少。</p>
