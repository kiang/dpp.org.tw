	                <p style="text-align: justify;"><span style="font-size: larger;">反核無懼文宣小冊<br />

</span><span style="background-color: rgb(255, 255, 0);"><span style="color: rgb(0, 0, 0);"><span style="font-size: medium;"><span style="font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; font-style: normal; font-variant: normal; font-weight: normal; letter-spacing: normal; line-height: 25.3438px; text-align: left; text-indent: 0px; text-transform: none; white-space: normal; word-spacing: 0px; display: inline ! important; float: none;">停建核四」已經是當前主流民意，民主進步黨特別製作「反核無懼」文宣手冊，強調台灣禁不起核災，核四繼續興建，錢坑永無止境。且在沒有核四的狀況下，台灣不但不缺電，浪費的發電量甚至相當於一座核四，可見立即停建核四，台灣不會缺電。希望大家能在閱讀後，更進一步了解我們為何要反核，以及台灣為什麼不適「核」。</span></span></span></span></p>
