				<h2>民進黨反核大事記</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>&nbsp;民進黨自創黨以來即堅持「非核家園」的理念，並將此精神落實至黨綱中，主張「反對新設核能發電機組，積極開發替代能源，限期關閉現有核電廠」，並朝此方向努力。<br />
<br />
1994年及1996年，尤清縣長與陳水扁市長分別在台北縣與台北市舉辦核四公投。而民進黨立院黨團除嚴審核四預算外，同時推動公投法之立法，期望藉由公投達到廢核四之目的。 <span style="color: rgb(255, 0, 0); "><strong><a href="http://dpppolicy.blogspot.com/2011/04/blog-post_22.html">閱讀更多...</a></strong></span></p>	                	            </div>
