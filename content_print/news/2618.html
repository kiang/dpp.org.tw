				<h2>挑戰劉內閣-社福篇</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt"><strong><span style="FONT-SIZE: 20pt; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">社會福利</span></strong><strong><span lang="EN-US" style="FONT-SIZE: 20pt"><font face="Times New Roman">----</font></span></strong><strong><span style="FONT-SIZE: 14pt; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">殘補式、缺乏章法的社福施政</span></strong><strong><span lang="EN-US" style="FONT-SIZE: 20pt"><o:p></o:p></span></strong></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt"><font size="3"><strong style="mso-bidi-font-weight: normal"><span style="BORDER-RIGHT: windowtext 1pt solid; PADDING-RIGHT: 0cm; BORDER-TOP: windowtext 1pt solid; PADDING-LEFT: 0cm; PADDING-BOTTOM: 0cm; BORDER-LEFT: windowtext 1pt solid; PADDING-TOP: 0cm; BORDER-BOTTOM: windowtext 1pt solid; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'; mso-border-alt: solid windowtext .5pt">問題焦點</span></strong></font></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt"><font size="3"><strong style="mso-bidi-font-weight: normal"><span style="BORDER-RIGHT: windowtext 1pt solid; PADDING-RIGHT: 0cm; BORDER-TOP: windowtext 1pt solid; PADDING-LEFT: 0cm; PADDING-BOTTOM: 0cm; BORDER-LEFT: windowtext 1pt solid; PADDING-TOP: 0cm; BORDER-BOTTOM: windowtext 1pt solid; FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'; mso-border-alt: solid windowtext .5pt"></span></strong><span lang="EN-US" style="BORDER-RIGHT: windowtext 1pt solid; PADDING-RIGHT: 0cm; BORDER-TOP: windowtext 1pt solid; PADDING-LEFT: 0cm; PADDING-BOTTOM: 0cm; BORDER-LEFT: windowtext 1pt solid; PADDING-TOP: 0cm; BORDER-BOTTOM: windowtext 1pt solid; mso-border-alt: solid windowtext .5pt"><o:p></o:p></span></font></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt 18pt; TEXT-INDENT: -18pt; mso-char-indent-count: -1.5"><font size="3"><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">一、近十來年所得分配明顯惡化，民國</span><span lang="EN-US"><font face="Times New Roman">87</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">年</span><span style="COLOR: black; FONT-FAMILY: 新細明體">平均每戶可支配所得的五分位差是<span lang="EN-US">5</span></span><span lang="EN-US" style="COLOR: black; FONT-FAMILY: 新細明體; mso-bidi-font-family: 新細明體"> </span><span lang="EN-US" style="COLOR: black; FONT-FAMILY: 新細明體">.51倍，96年提高至5.98倍。馬政府上台後，物價飛漲，除了近貧者（near poor）難以脫貧之外，從中產階級掉入的新貧者（new poor）也逐漸增多，造成社會不安。<o:p></o:p></span></font></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt"><font size="3"><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">二、所得分配惡化主要的原因是失業率增加，失業率民國</span><span lang="EN-US"><font face="Times New Roman">87</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">年失業率是</span><span lang="EN-US"><font face="Times New Roman">2.69</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">％，</span><span style="FONT-FAMILY: 新細明體; mso-bidi-font-family: 新細明體"> </span><span lang="EN-US"><font face="Times New Roman">96</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">年平均失業 </span></font></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt"><font size="3"><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 率為</span><span lang="EN-US"><font face="Times New Roman">3.91</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">％，今年</span><span lang="EN-US"><font face="Times New Roman">4</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">月</span><span lang="EN-US"><font face="Times New Roman">3.81</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">％，馬政府上台</span><span lang="EN-US"><font face="Times New Roman">7</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">月失業率增加到</span><span style="FONT-FAMILY: 新細明體; mso-bidi-font-family: 新細明體"> </span><span lang="EN-US"><font face="Times New Roman">4</font></span><span lang="EN-US" style="FONT-FAMILY: 新細明體; mso-bidi-font-family: 新細明體"> </span><span lang="EN-US"><font face="Times New Roman">.06</font></span><span style="FONT-FAMILY: 新細明體; mso-ascii-font-family: 'Times New Roman'; mso-hansi-font-family: 'Times New Roman'">％。<br /><br /><br /><br /><br /><br /></span></font></p>
