	                <p>&nbsp;馬英九在七月三日公開<a href="http://www.cna.com.tw/ShowNews/Detail.aspx?pNewsID=201107030131&amp;pType0=aIPL&amp;pTypeSel=0">表示</a>：「<font color="#c0504d">去年台灣經濟成長率達到10.88%，預估今年台灣國內生產毛額（GDP）平均達2萬700到2萬800美元，這比3年多前上任時增加了3500美元，而民進黨執政8年只增加了2700美元，顯見國民黨執政經濟成績超過民進黨執政。</font>」姑且不論近年來經濟成長對多數人而言總是看得到吃不到，也姑且不論所謂的今年GDP目前只是個預測值，我們只需要一點點財經常識，就不難識破：<strong>馬先生這番推論完全是胡說八道</strong>。</p>
