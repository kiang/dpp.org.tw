				<h2>吳惠林：經濟復甦是假象 鼓勵消費是愚民</h2>
				<h4></h4>
                <div id="media_contents" class="w80 container">
	                					<hr>
	                <p>全球景氣趨緩，美國聯準會（Fed）、世界銀行（World  Bank）及國際貨幣基金（ＩＭＦ）等紛紛示警，二次衰退疑慮加深。中華經濟研究院研究員吳惠林認為，其實景氣早就衰退了，之前經濟復甦只是假象，是各國 政府砸錢堆積出來的，泡沫還在，一旦泡沫破滅，二○○八年金融海嘯掀起的失業潮將會重演，但政府不要想依靠中國，也不要再採取反景氣的手段來救市，政府介 入卻未對症下藥，反而是在戕害市場，應回歸市場機制，經濟才能調整到健康的狀態。</p>
